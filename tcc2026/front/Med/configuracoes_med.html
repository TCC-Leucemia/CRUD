<!DOCTYPE html>
<html lang="pt-BR" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <script src="../JS/theme-init.js"></script>
  <script src="../JS/erro-popup.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HematoAI · Configurações</title>
  <link rel="stylesheet" href="../CSS/navbar.css">
  <style>
    .main-content,
    .page-body {
      min-width: 0;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: minmax(210px, 0.72fr) minmax(0, 1.28fr);
      gap: 20px;
      align-items: start;
    }

    .settings-card {
      min-width: 0;
      margin: 0;
    }

    .settings-card .card-header {
      padding: 14px 18px;
    }

    .settings-card .card-body {
      padding: 18px;
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .theme-option {
      min-width: 0;
      min-height: 112px;
      padding: 16px 10px;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg);
      color: var(--text-1);
      text-align: center;
      transition: var(--transition);
    }

    .theme-option:hover {
      border-color: var(--red);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .theme-option.active {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.08);
    }

    .theme-icon {
      display: block;
      margin-bottom: 7px;
      font-size: 1.8rem;
      line-height: 1;
    }

    .theme-name {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .theme-description,
    .theme-note,
    .field-hint {
      color: var(--text-3);
      font-size: 0.7rem;
      line-height: 1.4;
    }

    .theme-description {
      display: block;
      margin-top: 3px;
    }

    .theme-note {
      margin-top: 12px;
    }

    .profile-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
    }

    .profile-form-grid .form-group {
      min-width: 0;
      gap: 4px;
    }

    .profile-form-grid .form-group input {
      min-width: 0;
      padding: 9px 12px;
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 42px !important;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 7px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text-3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
    }

    .password-toggle:hover,
    .password-toggle:focus-visible {
      background: var(--surface);
      color: var(--text-1);
      outline: 2px solid var(--border);
    }

    .password-toggle svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .profile-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    /* Estilo para campos não editáveis */
    input[readonly] {
      background: var(--bg);
      color: var(--text-1);
      cursor: not-allowed;
      opacity: 0.8;
    }

    input[readonly]:focus {
      border-color: var(--border);
      box-shadow: none;
    }

    @media (max-width: 700px) {
      .settings-grid {
        grid-template-columns: 1fr;
      }

      .profile-form-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .theme-options {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .theme-option {
        min-height: 104px;
        padding-inline: 6px;
      }

      .profile-actions {
        flex-direction: column-reverse;
      }

      .profile-actions .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir navegação">☰</button>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Configurações</h1>
        <p>Aparência e dados da sua conta</p>
      </div>
      <div class="page-header-right">
        <span class="badge badge-green">Médico</span>
      </div>
    </div>

    <div class="page-body">
      <div class="settings-grid">
        <section class="card settings-card" aria-labelledby="tituloAparencia">
          <div class="card-header">
            <span class="card-title" id="tituloAparencia">🎨 Aparência</span>
          </div>
          <div class="card-body">
            <div class="theme-options" role="group" aria-label="Tema do sistema">
              <button class="theme-option" id="themeLight" type="button" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">☀️</span>
                <span class="theme-name">Claro</span>
                <span class="theme-description">Fundo claro</span>
              </button>
              <button class="theme-option" id="themeDark" type="button" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">🌙</span>
                <span class="theme-name">Escuro</span>
                <span class="theme-description">Menos brilho</span>
              </button>
            </div>
            <p class="theme-note">A preferência é salva automaticamente neste dispositivo.</p>
          </div>
        </section>

        <section class="card settings-card" aria-labelledby="tituloDadosPessoais">
          <div class="card-header">
            <span class="card-title" id="tituloDadosPessoais">👤 Dados pessoais</span>
          </div>
          <div class="card-body">
            <form id="formDadosPessoais">
              <div class="profile-form-grid">
                <div class="form-group">
                  <label for="nomeCompleto">Nome completo</label>
                  <input id="nomeCompleto" name="nome" type="text" maxlength="200" autocomplete="name" required readonly>
                </div>
                <div class="form-group">
                  <label for="crm">CRM</label>
                  <input id="crm" name="crm" type="text" maxlength="11" autocomplete="off" required readonly>
                </div>
                <div class="form-group">
                  <label for="especialidade">Especialidade</label>
                  <input id="especialidade" name="especialidade" type="text" maxlength="50" required readonly>
                </div>
                <div class="form-group">
                  <label for="email">E-mail</label>
                  <input id="email" name="email" type="email" maxlength="100" autocomplete="email" required>
                </div>
                <div class="form-group">
                  <label for="telefone">Telefone</label>
                  <input id="telefone" name="telefone" type="tel" maxlength="20" autocomplete="tel" readonly>
                </div>
                <div class="form-group">
                  <label for="senha">Senha</label>
                  <div class="password-field">
                    <input
                      id="senha"
                      name="senha"
                      type="password"
                      minlength="8"
                      maxlength="72"
                      autocomplete="new-password"
                      placeholder="••••••••"
                      aria-describedby="senhaHint"
                    >
                    <button
                      class="password-toggle"
                      id="toggleSenha"
                      type="button"
                      aria-label="Mostrar senha digitada"
                      aria-controls="senha"
                    ></button>
                  </div>
                  <span class="field-hint" id="senhaHint">Vazio mantém a senha atual.</span>
                </div>
              </div>

              <div class="profile-actions">
                <button class="btn btn-ghost" id="btnCancelar" type="button">Cancelar</button>
                <button class="btn btn-primary" id="btnSalvar" type="submit">Salvar alterações</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../JS/navbar.js"></script>
<script src="../JS/auth.js"></script>
<script>
  const iconeOlho = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  `;
  const iconeOlhoFechado = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m3 3 18 18"></path>
      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
      <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.1 3.2"></path>
      <path d="M6.6 6.6C3.6 8.6 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 4.1-.9"></path>
    </svg>
  `;

  const campos = {
    nome: document.getElementById("nomeCompleto"),
    crm: document.getElementById("crm"),
    especialidade: document.getElementById("especialidade"),
    email: document.getElementById("email"),
    telefone: document.getElementById("telefone"),
    senha: document.getElementById("senha")
  };
  const form = document.getElementById("formDadosPessoais");
  const btnSalvar = document.getElementById("btnSalvar");
  const toggleSenha = document.getElementById("toggleSenha");
  let medicoDados = {};

  function atualizarTemaSelecionado(tema) {
    const claro = document.getElementById("themeLight");
    const escuro = document.getElementById("themeDark");
    claro.classList.toggle("active", tema === "light");
    escuro.classList.toggle("active", tema === "dark");
    claro.setAttribute("aria-pressed", String(tema === "light"));
    escuro.setAttribute("aria-pressed", String(tema === "dark"));
  }

  function selecionarTema(tema) {
    HematoAI.aplicarTema(tema);
    atualizarTemaSelecionado(tema);
  }

  function preencherFormulario() {
    campos.nome.value = medicoDados.nome || "";
    campos.crm.value = medicoDados.crm || "";
    campos.especialidade.value = medicoDados.especialidade || "";
    campos.email.value = medicoDados.email || "";
    campos.telefone.value = medicoDados.telefone || "";
    campos.senha.value = "";
    campos.senha.type = "password";
    toggleSenha.innerHTML = iconeOlho;
    toggleSenha.setAttribute("aria-label", "Mostrar senha digitada");
  }

  async function carregarDadosMedico() {
    try {
      const response = await apiFetch("/medicos/meus-dados");
      const dados = await response.json();
      if (!response.ok || !dados.status) {
        throw new Error(dados.msg || "Erro ao carregar os dados.");
      }
      medicoDados = dados.dados;
      preencherFormulario();
    } catch (erro) {
      HematoAI.showToast(erro.message || "Erro ao conectar com o servidor.", "error");
    }
  }

  function atualizarSessao(dados) {
    localStorage.setItem("token", dados.token);
    localStorage.setItem("usuario", JSON.stringify(dados.usuario));
    const sessaoAtual = HematoAI.getSession();
    HematoAI.setSession({
      ...sessaoAtual,
      token: dados.token,
      tipo: "Médico",
      nome: dados.usuario.nome,
      email: dados.usuario.email,
      id_usuario: dados.usuario.id_usuario
    });
  }

  function solicitarSenhaAtual(mensagem) {
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloConfirmarSenha" style="max-width:420px">
          <div class="modal-header">
            <h2 id="tituloConfirmarSenha">Confirmar alteração</h2>
            <button class="btn-close-modal" type="button" data-cancelar aria-label="Fechar">✕</button>
          </div>
          <form>
            <div class="modal-body">
              <p data-mensagem style="margin-bottom:16px;color:var(--text-2);font-size:.85rem;line-height:1.5"></p>
              <div class="form-group">
                <label for="senhaAtualConfirmacao">Senha atual</label>
                <input
                  id="senhaAtualConfirmacao"
                  type="password"
                  maxlength="72"
                  autocomplete="current-password"
                  required
                >
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" type="button" data-cancelar>Cancelar</button>
              <button class="btn btn-primary" type="submit">Confirmar</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(overlay);

      const input = overlay.querySelector("input");
      const formConfirmacao = overlay.querySelector("form");
      overlay.querySelector("[data-mensagem]").textContent = mensagem;
      let finalizado = false;

      const finalizar = (senhaAtual = null) => {
        if (finalizado) return;
        finalizado = true;
        input.value = "";
        HematoAI.closeModal(overlay);
        setTimeout(() => overlay.remove(), 220);
        resolve(senhaAtual);
      };

      overlay.querySelectorAll("[data-cancelar]").forEach((botao) => {
        botao.addEventListener("click", () => finalizar());
      });
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) finalizar();
      });
      formConfirmacao.addEventListener("submit", (event) => {
        event.preventDefault();
        const senhaAtual = input.value;
        finalizar(senhaAtual);
      });

      HematoAI.openModal(overlay);
      input.focus();
    });
  }

  async function enviarDados(senhaAtual = "") {
    const payload = {
      nome: campos.nome.value,
      crm: campos.crm.value,
      especialidade: campos.especialidade.value,
      email: campos.email.value,
      telefone: campos.telefone.value,
      senha: campos.senha.value
    };
    if (senhaAtual) payload.senhaAtual = senhaAtual;

    const response = await apiFetch("/medicos/meus-dados", {
      method: "PUT",
      body: JSON.stringify(payload)
    });
    const dados = await response.json();
    return { response, dados };
  }

  async function salvarDados(event) {
    event.preventDefault();
    btnSalvar.disabled = true;
    const textoOriginal = btnSalvar.textContent;
    btnSalvar.textContent = "Salvando...";

    try {
      let { response, dados } = await enviarDados();
      let codigo = dados?.detalhes?.codigo;

      while (
        codigo === "REAUTENTICACAO_NECESSARIA" ||
        codigo === "SENHA_ATUAL_INCORRETA"
      ) {
        let senhaAtual = await solicitarSenhaAtual(dados.msg);
        if (senhaAtual === null) return;
        ({ response, dados } = await enviarDados(senhaAtual));
        senhaAtual = "";
        codigo = dados?.detalhes?.codigo;
      }

      if (!response.ok || !dados.status) {
        throw new Error(dados.msg || "Não foi possível salvar as alterações.");
      }

      medicoDados = dados.dados;
      atualizarSessao(dados);
      preencherFormulario();
      HematoAI.initSidebar("config");
      HematoAI.showToast(dados.msg, "success");
    } catch (erro) {
      HematoAI.showToast(erro.message || "Erro ao comunicar com o servidor.", "error");
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.textContent = textoOriginal;
    }
  }

  document.getElementById("themeLight").addEventListener("click", () => selecionarTema("light"));
  document.getElementById("themeDark").addEventListener("click", () => selecionarTema("dark"));
  document.getElementById("btnCancelar").addEventListener("click", preencherFormulario);
  form.addEventListener("submit", salvarDados);
  campos.crm.addEventListener("input", () => {
    campos.crm.value = campos.crm.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  });
  toggleSenha.addEventListener("click", () => {
    const visivel = campos.senha.type === "text";
    campos.senha.type = visivel ? "password" : "text";
    toggleSenha.innerHTML = visivel ? iconeOlho : iconeOlhoFechado;
    toggleSenha.setAttribute(
      "aria-label",
      visivel ? "Mostrar senha digitada" : "Ocultar senha digitada"
    );
    campos.senha.focus();
  });

  window.addEventListener("DOMContentLoaded", async () => {
    verificarPerfil("Médico");
    HematoAI.initSidebar("config");
    const tema = localStorage.getItem("hematoai_theme") || "light";
    atualizarTemaSelecionado(tema);
    toggleSenha.innerHTML = iconeOlho;
    await carregarDadosMedico();
  });
</script>
</body>
</html>
