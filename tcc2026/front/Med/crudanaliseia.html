<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="../JS/theme-init.js"></script>
  <script src="../JS/erro-popup.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HematoAI · Análises IA</title>
  <link rel="stylesheet" href="../CSS/navbar.css">
  <style>
    .main-content,
    .page-body,
    .page-body .card {
      min-width: 0;
    }

    .table-wrapper {
      width: 100%;
      max-width: 100%;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 0.9rem;
      background: var(--surface);
      color: var(--text-1);
      font-family: var(--font);
      outline: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185,28,28,0.08);
    }

    /* ── Barra de pesquisa estilo botão ── */
    .search-wrapper {
      position: relative;
      display: inline-block;
    }

    .search-wrapper input {
      padding: 10px 14px 10px 40px;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 0.9rem;
      background: var(--surface);
      color: var(--text-1);
      font-family: var(--font);
      outline: none;
      width: 100%;
      min-width: 200px;
      transition: var(--transition);
    }

    .search-wrapper input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185,28,28,0.08);
    }

    .search-wrapper input::placeholder {
      color: var(--text-3);
      font-weight: 400;
    }

    .search-wrapper .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
      font-size: 1rem;
      line-height: 1;
    }

    .suspeita-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .suspeita-alta { background: #fee2e2; color: #dc2626; }
    .suspeita-moderada { background: #fef3c7; color: #d97706; }
    .suspeita-baixa { background: #dbeafe; color: #2563eb; }
    .suspeita-sem { background: #dcfce7; color: #15803d; }

    .tipo-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .tipo-hemograma { background: var(--red-light); color: var(--red); }
    .tipo-mielograma { background: var(--purple-light); color: var(--purple); }

    /* ── Painéis do modal de detalhes ── */
    .detalhe-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .detalhe-panel:last-child {
      margin-bottom: 0;
    }
    .detalhe-panel .panel-title {
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-2);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .detalhe-panel .grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 4px 16px;
      font-size: 0.95rem;
    }
    .detalhe-panel .grid .label {
      color: var(--text-2);
      font-weight: 600;
    }
    .detalhe-panel .grid .valor {
      color: var(--text-1);
      font-weight: 500;
    }
    .detalhe-panel .grid .valor.destaque {
      font-weight: 700;
      color: var(--red);
    }

    .resultado-texto {
      background: var(--bg);
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      line-height: 1.7;
      white-space: pre-wrap;
      min-height: 80px;
      margin-top: 4px;
    }

    .info-box {
      background: var(--blue-light);
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      font-size: 0.9rem;
      color: var(--blue);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    /* ── Botões de ação na tabela ── */
    .td-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .td-actions .btn {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      transition: var(--transition);
    }

    .td-actions .btn i {
      width: 14px;
      height: 14px;
    }

    /* Botão Ver (estilo ghost) */
    .td-actions .btn-ver {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text-2);
    }

    .td-actions .btn-ver:hover {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-light);
    }

    /* Botão Excluir (estilo danger - fundo vermelho) */
    .td-actions .btn-excluir {
      background: var(--red);
      border: 1.5px solid var(--red);
      color: white;
    }

    .td-actions .btn-excluir:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(185,28,28,0.4);
    }

    .btn-success {
      background: #15803d;
      color: white;
      box-shadow: 0 2px 8px rgba(21,128,61,0.3);
    }
    .btn-success:hover {
      background: #166534;
      box-shadow: 0 4px 16px rgba(21,128,61,0.4);
      transform: translateY(-1px);
    }

    /* Aumentar fontes da tabela */
    .table-wrapper table th {
      font-size: 0.85rem;
      padding: 12px 16px;
    }
    .table-wrapper table td {
      font-size: 0.9rem;
      padding: 12px 16px;
    }
    .table-wrapper table td .btn {
      font-size: 0.8rem;
    }

    /* Aumentar fontes do header */
    .page-header h1 {
      font-size: 1.8rem;
    }
    .page-header p {
      font-size: 1rem;
    }

    /* Aumentar fontes do card */
    .card-title {
      font-size: 1.1rem;
    }

    /* Aumentar fontes do modal */
    .modal-header h2 {
      font-size: 1.4rem;
    }
    .modal-body label {
      font-size: 0.9rem;
    }
    .modal-body input,
    .modal-body select,
    .modal-body textarea {
      font-size: 0.95rem;
      padding: 12px 16px;
    }

    /* ── Modo escuro ── */
    .dark-mode .detalhe-panel {
      background: var(--surface);
      border-color: var(--border);
    }
    .dark-mode .detalhe-panel .panel-title {
      border-bottom-color: var(--border);
    }
  </style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle">☰</button>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Análises IA</h1>
        <p>Resultados da inteligência artificial para diagnóstico</p>
      </div>
      <div class="page-header-right">
        <button class="btn btn-success" id="btnNovaAnalise"><span class="btn-plus">+</span>Nova Análise IA</button>
      </div>
    </div>

    <div class="page-body">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Lista de Análises</span>
          <div class="filter-row">
            <div class="search-wrapper">
              <span class="search-icon">🔍</span>
              <input type="text" id="searchAnalise" placeholder="Buscar por paciente ou CPF...">
            </div>
            <select id="filterSuspeita" class="filter-select">
              <option value="">Todas as suspeitas</option>
              <option value="Alta">Alta</option>
              <option value="Moderada">Moderada</option>
              <option value="Baixa">Baixa</option>
              <option value="Sem suspeita">Sem suspeita</option>
            </select>
            <select id="filterTipoExame" class="filter-select">
              <option value="">Todos os tipos</option>
              <option value="Hemograma">Hemograma</option>
              <option value="Mielograma">Mielograma</option>
            </select>
            <select id="filterTipoLeucemia" class="filter-select">
              <option value="">Todos os tipos de leucemia</option>
              <option value="LLA">LLA</option>
              <option value="LMA">LMA</option>
              <option value="LLC">LLC</option>
              <option value="LMC">LMC</option>
              <option value="Não identificado">Não identificado</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="btnRecarregar">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
              Atualizar
            </button>
          </div>
        </div>

        <div class="table-wrapper" style="border:none;border-radius:0 0 var(--radius-xl) var(--radius-xl)">
          <table>
            <thead>
              <tr>
                <th>Paciente</th>
                <th>CPF</th>
                <th>Data Consulta</th>
                <th>Tipo Leucemia</th>
                <th>Tipo Exame</th>
                <th>Suspeita</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tbodyAnalises"></tbody>
          </table>
          <div class="empty-state" id="emptyState" style="display:none">
            <p>Nenhuma análise IA encontrada.</p>
            <p style="font-size:0.9rem;color:var(--text-3);margin-top:4px">Ajuste os filtros ou aguarde novas análises.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Detalhes -->
<div class="modal-overlay" id="modalDetalhes">
  <div class="modal">
    <div class="modal-header">
      <h2>Detalhes da Análise IA</h2>
      <button class="btn-close-modal" id="closeModalDetalhes">✕</button>
    </div>
    <div class="modal-body" id="detalheBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="fecharDetalhes">Fechar</button>
      <button class="btn btn-primary" id="btnBaixarPDFDetalhe">📄 Baixar relatório</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../JS/navbar.js"></script>
<script>
  
  HematoAI.initSidebar('analises-ia');

  let idDetalhe = null;
  let analises = [];
  let filtrados = [];

  async function carregar() {

    try {

        const session = JSON.parse(
            localStorage.getItem("hematoai_session")
        );

        const response = await fetch(
            "http://localhost:3000/analise-ia",
            {
                headers: {
                    Authorization: `Bearer ${session.token}`
                }
            }
        );

        const json = await response.json();

        if (!response.ok || !json.status) {
            throw new Error(json.msg);
        }

        analises = json.dados;
        console.log(json.dados);

        aplicarFiltros();

    }
    catch (erro) {

        HematoAI.showToast(
            erro.message,
            "error"
        );
    }
  }
  function formatarCPF(cpf) {
    if (!cpf || cpf === '—') return '—';
    const c = String(cpf).replace(/\D/g, '').padStart(11, '0');
    return c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  }

  function formatarDataHora(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function suspeitaBadge(suspeita) {
    const map = { 'Alta': 'alta', 'Moderada': 'moderada', 'Baixa': 'baixa', 'Sem suspeita': 'sem' };
    return `<span class="suspeita-badge suspeita-${map[suspeita] || 'sem'}">${suspeita || '—'}</span>`;
  }

  function tipoBadge(tipo) {
    if (tipo === 'Hemograma') return `<span class="tipo-badge tipo-hemograma">Hemograma</span>`;
    if (tipo === 'Mielograma') return `<span class="tipo-badge tipo-mielograma">Mielograma</span>`;
    return `<span style="color:var(--text-3)">—</span>`;
  }

  function formatarData(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR');
  }

  // ============================================
  // RENDERIZAÇÃO
  // ============================================
  
  function renderTabela(data) {
    const tbody = document.getElementById('tbodyAnalises');
    const empty = document.getElementById('emptyState');
    tbody.innerHTML = '';

    if (!data.length) {
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    data.forEach(a => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:600;font-size:0.95rem">${a.nome}</td>
        <td style="font-family:var(--font-mono);font-size:0.9rem">${formatarCPF(a.cpf)}</td>
        <td style="font-size:0.9rem">${formatarDataHora(a.data_consulta)}</td>
        <td>
          <span class="badge badge-purple" style="font-size:0.8rem;padding:4px 12px;">
            ${a.tipo_leucemia_ia || "Não identificado"}
          </span>
        </td>
        <td>${tipoBadge(a.tipo_exame)}</td>
        <td>${suspeitaBadge(a.suspeita_ia)}</td>
        <td>
          <div class="td-actions">
            <button class="btn btn-ver" onclick="abrirDetalhes(${a.id_analise})">Ver</button>
            <button class="btn btn-excluir" onclick="confirmarExclusao(${a.id_analise})">
              <i data-lucide="trash-2"></i>
              Excluir
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
    lucide.createIcons();
  }

  function aplicarFiltros() {
    const q = document.getElementById('searchAnalise').value.toLowerCase().trim();
    const suspeita = document.getElementById('filterSuspeita').value;
    const tipoExame = document.getElementById('filterTipoExame').value;
    const tipoLeucemia = document.getElementById('filterTipoLeucemia').value;

    filtrados = analises.filter(a => {
      const matchPaciente = a.nome.toLowerCase().includes(q);
      const cpfBusca = q.replace(/\D/g, '');
      const matchCpf = cpfBusca !== '' && (a.cpf || '').includes(cpfBusca);

      return (matchPaciente || matchCpf) &&
          (!suspeita || a.suspeita_ia === suspeita) &&
          (!tipoExame || a.tipo_exame === tipoExame) &&
          (!tipoLeucemia || (a.tipo_leucemia_ia || 'Não identificado') === tipoLeucemia);
    });
    renderTabela(filtrados);
  }

  async function excluirAnalise(id) {

    try {

        const session = JSON.parse(
            localStorage.getItem("hematoai_session")
        );

        const response = await fetch(
            `http://localhost:3000/analise-ia/${id}`,
            {
                method: "DELETE",
                headers: {
                    Authorization: `Bearer ${session.token}`
                }
            }
        );

        const json = await response.json();

        if (!response.ok || !json.status) {
            throw new Error(json.msg);
        }

        HematoAI.showToast(
            json.msg,
            "success"
        );

        carregar();

    }
    catch (erro) {

        HematoAI.showToast(
            erro.message,
            "error"
        );
    }

  }
  function confirmarExclusao(id){

    HematoAI.confirmDialog(

        `Deseja excluir a análise IA?<br>Esta ação não pode ser desfeita.`,

        () => excluirAnalise(id)

    );

}

  document.getElementById('searchAnalise').addEventListener('input', aplicarFiltros);
  document.getElementById('filterSuspeita').addEventListener('change', aplicarFiltros);
  document.getElementById('filterTipoExame').addEventListener('change', aplicarFiltros);
  document.getElementById('filterTipoLeucemia').addEventListener('change', aplicarFiltros);
  document.getElementById('btnRecarregar').addEventListener('click', carregar);

  // ============================================
  // REDIRECIONAR PARA NOVA ANÁLISE
  // ============================================
  
  document.getElementById('btnNovaAnalise').addEventListener('click', () => {
    window.location.href = 'nova_analise_ia.html';
  });

  // ============================================
  // DETALHES
  // ============================================
  
  function abrirDetalhes(id) {
    idDetalhe = id;
    const a = analises.find(x => x.id_analise === id);

    if (!a) {
      document.getElementById('detalheBody').innerHTML = '<p style="color:var(--red);padding:20px">Análise não encontrada.</p>';
    } else {
      document.getElementById('detalheBody').innerHTML = `
        <!-- Painel: Informações do Paciente -->
        <div class="detalhe-panel">
          <div class="panel-title">Informações do Paciente</div>
          <div class="grid">
            <span class="label">Paciente</span>
            <span class="valor" style="font-weight:600;">${a.nome}</span>
            <span class="label">CPF</span>
            <span class="valor" style="font-family:var(--font-mono);">${formatarCPF(a.cpf)}</span>
          </div>
        </div>

        <!-- Painel: Informações da Consulta -->
        <div class="detalhe-panel">
          <div class="panel-title">Informações da Consulta</div>
          <div class="grid">
            <span class="label">Data da Consulta</span>
            <span class="valor">${formatarDataHora(a.data_consulta)}</span>
            <span class="label">Tipo de Exame</span>
            <span class="valor">${tipoBadge(a.tipo_exame)}</span>
          </div>
        </div>

        <!-- Painel: Informações Retornadas pela IA -->
        <div class="detalhe-panel">
          <div class="panel-title">Informações Retornadas pela IA</div>
          <div class="grid">
            <span class="label">Suspeita</span>
            <span class="valor">${suspeitaBadge(a.suspeita_ia)}</span>
            <span class="label">Tipo de Leucemia</span>
            <span class="valor"><span class="badge badge-purple" style="font-size:0.9rem;padding:4px 14px;">${a.tipo_leucemia_ia || 'Não identificado'}</span></span>
            <span class="label">Confiança</span>
            <span class="valor" style="font-weight:700;color:${a.confianca >= 80 ? '#15803d' : a.confianca >= 50 ? '#d97706' : '#94a3b8'}">${a.confianca ? a.confianca + '%' : '—'}</span>
            <span class="label">Data da Análise</span>
            <span class="valor">${formatarData(a.data_analise)}</span>
          </div>
        </div>

        <!-- Painel: Resultado da IA -->
        <div class="detalhe-panel">
          <div class="panel-title">Resultado da IA</div>
          <div class="resultado-texto">${a.resultado_ia}</div>
        </div>
      `;
    }

    HematoAI.openModal(document.getElementById('modalDetalhes'));
  }

  // ============================================
  // BAIXAR PDF
  // ============================================
  
  document.getElementById('btnBaixarPDFDetalhe').addEventListener('click', () => {
    const a = analises.find(x => x.id_analise === idDetalhe);
    if (!a) {
      HematoAI.showToast('Análise não encontrada.', 'error');
      return;
    }

    const paciente = a;
    const conteudoPDF = `
HEMATOAI - RELATÓRIO DE ANÁLISE IA
=============================================
Paciente: ${a.nome}
CPF: ${formatarCPF(a.cpf)}
Data da Consulta: ${formatarDataHora(a.data_consulta)}
Tipo de Exame: ${a.tipo_exame}
Data da Análise: ${formatarData(a.data_analise)}

---------------------------------------------
RESULTADO DA ANÁLISE:
${a.resultado_ia}

---------------------------------------------
SUSPEITA: ${a.suspeita_ia}
TIPO DE LEUCEMIA: ${a.tipo_leucemia_ia || 'Não identificado'}
CONFIANÇA: ${a.confianca ? a.confianca + '%' : '—'}

---------------------------------------------
Este relatório é gerado automaticamente pelo sistema HematoAI.
Consulte um especialista para validação do diagnóstico.
`;

    const blob = new Blob([conteudoPDF], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const aLink = document.createElement('a');
    aLink.href = url;
    aLink.download = `analise_ia_${a.id_analise}.txt`;
    document.body.appendChild(aLink);
    aLink.click();
    document.body.removeChild(aLink);
    URL.revokeObjectURL(url);

    HematoAI.showToast('Relatório baixado com sucesso!', 'success');
  });

  // ============================================
  // FECHAR MODAIS
  // ============================================
  
  document.getElementById('closeModalDetalhes').addEventListener('click', () => HematoAI.closeModal(document.getElementById('modalDetalhes')));
  document.getElementById('fecharDetalhes').addEventListener('click', () => HematoAI.closeModal(document.getElementById('modalDetalhes')));
  
  carregar();
</script>
</body>
</html>
