<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HematoAI · Confirmar código</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #1a1f2c;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        :root {
            --medical-red: #b91c1c;
            --medical-red-dark: #991b1b;
            --medical-red-light: #fee2e2;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-700: #374151;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
            width: 100%;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 20px 0;
            border-bottom: 1px solid var(--gray-200);
            background-color: white;
        }

        .logo-link {
            text-decoration: none;
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease;
            border-radius: 12px;
            padding: 4px 8px 4px 4px;
            background: transparent;
        }
        .logo-link:hover {
            opacity: 0.85;
            background-color: var(--gray-50);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--medical-red);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
            font-family: monospace;
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--gray-900);
            position: relative;
            top: 4px;
        }

        .logo-text span {
            color: var(--medical-red);
        }

        .tagline {
            font-size: 0.8rem;
            color: var(--gray-700);
            margin-left: 6px;
            font-weight: 400;
            border-left: 1px solid var(--gray-300);
            padding-left: 10px;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--medical-red);
            color: var(--medical-red);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-outline:hover {
            background-color: var(--medical-red-light);
            border-color: var(--medical-red-dark);
            transform: translateY(-1px);
        }

        /* ========== FORMULÁRIO ========== */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .login-card {
            max-width: 460px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: var(--shadow-lg);
            padding: 40px 36px;
            border: 1px solid var(--gray-100);
            transition: transform 0.2s;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--gray-900);
            text-align: center;
        }

        .login-sub {
            text-align: center;
            color: var(--gray-700);
            font-size: 0.9rem;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--gray-200);
            display: inline-block;
            width: auto;
            padding-bottom: 8px;
        }

        /* ===== CAMPOS DE CÓDIGO EM QUADRADINHOS ===== */
        .codigo-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 8px 0 32px 0;
        }

        .codigo-input {
            width: 52px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            border: 2px solid var(--gray-200);
            border-radius: 16px;
            background: white;
            color: var(--gray-900);
            outline: none;
            transition: all 0.2s ease;
            caret-color: var(--medical-red);
        }

        .codigo-input:focus {
            border-color: var(--medical-red);
            box-shadow: 0 0 0 4px var(--medical-red-light);
            transform: scale(1.02);
        }

        .codigo-input.preencher {
            border-color: var(--medical-red);
            background-color: var(--medical-red-light);
        }

        .codigo-input::-webkit-inner-spin-button,
        .codigo-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .codigo-input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Esconde as setinhas do input number */
        .codigo-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .codigo-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        .btn-entrar {
            width: 100%;
            background-color: var(--medical-red);
            border: none;
            color: white;
            padding: 14px 0;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 12px;
            margin-bottom: 24px;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
        }

        .btn-entrar:hover {
            background-color: var(--medical-red-dark);
            transform: translateY(-1px);
        }

        .btn-entrar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .link-reenviar {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gray-700);
            border-top: 1px solid var(--gray-200);
            padding-top: 24px;
        }

        .link-reenviar a {
            color: var(--medical-red);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
            cursor: pointer;
        }

        .link-reenviar a:hover {
            text-decoration: underline;
            color: var(--medical-red-dark);
        }

        .footer {
            text-align: center;
            padding: 24px 0 20px;
            border-top: 1px solid var(--gray-200);
            font-size: 0.75rem;
            color: var(--gray-700);
            margin-top: 20px;
        }

        .bg-accent {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(185,28,28,0.02) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            z-index: -1;
        }

        @media (max-width: 600px) {
            .container { padding: 0 20px; }
            .header { flex-direction: row; flex-wrap: wrap; gap: 12px; }
            .logo-link { margin-right: auto; }
            .nav-buttons { margin-left: auto; }
            .login-card { padding: 32px 24px; }
            .login-title { font-size: 1.5rem; }
            .codigo-container { gap: 8px; }
            .codigo-input { width: 44px; height: 52px; font-size: 1.3rem; }
        }

        @media (max-width: 480px) {
            .logo-text { font-size: 1.2rem; }
            .tagline { display: none; }
            .btn-outline { padding: 6px 14px; font-size: 0.8rem; }
            .codigo-container { gap: 6px; }
            .codigo-input { width: 38px; height: 46px; font-size: 1.1rem; }
        }
    </style>
  <script src="../JS/erro-popup.js"></script>
</head>
<body>
<div class="bg-accent"></div>
<div class="container">
    <header class="header">
        <a href="telaInicial" class="logo-link" aria-label="Página inicial HematoAI">
            <div class="logo-icon">H</div>
            <div class="logo-text">Hemato<span>AI</span></div>
            <div class="tagline">Inteligência em Hematologia</div>
        </a>
        <div class="nav-buttons">
            <button class="btn-outline" id="btnContatoLogin" aria-label="Contato profissional">
                Contato
            </button>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <div class="login-title">Confirmar código</div>
            <div style="text-align: center; margin-bottom: 28px;">
                <span class="login-sub">Digite o código enviado para seu e-mail.</span>
            </div>

            <form id="formConfirmar" action="#" method="post">
                <!-- Container dos 6 quadradinhos -->
                <div class="codigo-container" id="codigoContainer">
                    <input type="number" class="codigo-input" id="digito1" maxlength="1" min="0" max="9" inputmode="numeric" autofocus>
                    <input type="number" class="codigo-input" id="digito2" maxlength="1" min="0" max="9" inputmode="numeric">
                    <input type="number" class="codigo-input" id="digito3" maxlength="1" min="0" max="9" inputmode="numeric">
                    <input type="number" class="codigo-input" id="digito4" maxlength="1" min="0" max="9" inputmode="numeric">
                    <input type="number" class="codigo-input" id="digito5" maxlength="1" min="0" max="9" inputmode="numeric">
                    <input type="number" class="codigo-input" id="digito6" maxlength="1" min="0" max="9" inputmode="numeric">
                </div>

                <!-- Campo oculto para armazenar o código completo -->
                <input type="hidden" id="codigoCompleto" value="">

                <button type="submit" class="btn-entrar" id="btnConfirmar" disabled>Confirmar código</button>
            </form>

            <div class="link-reenviar">
                <a id="reenviarCodigo">Reenviar código</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>HematoAI · Sistema de apoio ao diagnóstico hematológico · Segurança e confidencialidade</p>
    </footer>
</div>
<script>
    (function() {
        // Contato
        const btnContato = document.getElementById('btnContatoLogin');
        if (btnContato) {
            btnContato.addEventListener('click', () => {
                mostrarInfo(
                    "Central de suporte: contato@hematoai.com.br | Telefone: (11) 4000-1234. Segunda a sexta, 8h-18h.",
                    { categoria: "Contato", titulo: "Fale com o suporte" }
                );
            });
        }

        // =================================================
        // LÓGICA DOS QUADRADINHOS DE CÓDIGO
        // =================================================
        const inputs = [
            document.getElementById('digito1'),
            document.getElementById('digito2'),
            document.getElementById('digito3'),
            document.getElementById('digito4'),
            document.getElementById('digito5'),
            document.getElementById('digito6')
        ];

        const btnConfirmar = document.getElementById('btnConfirmar');
        const codigoCompleto = document.getElementById('codigoCompleto');

        // Função para verificar se todos os campos estão preenchidos
        function verificarCampos() {
            const todosPreenchidos = inputs.every(input => input.value.length === 1);
            btnConfirmar.disabled = !todosPreenchidos;

            if (todosPreenchidos) {
                const codigo = inputs.map(input => input.value).join('');
                codigoCompleto.value = codigo;
            } else {
                codigoCompleto.value = '';
            }
        }

        // Função para avançar para o próximo campo
        function avancarParaProximo(index) {
            if (index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        }

        // Função para voltar ao campo anterior (Backspace)
        function voltarParaAnterior(index) {
            if (index > 0) {
                inputs[index - 1].focus();
                inputs[index - 1].value = '';
            }
        }

        // Aplicar eventos em cada input
        inputs.forEach((input, index) => {
            // Evento de input: quando o usuário digita
            input.addEventListener('input', function(e) {
                // Remove qualquer caractere que não seja número
                this.value = this.value.replace(/\D/g, '');

                // Limita a 1 caractere
                if (this.value.length > 1) {
                    this.value = this.value.slice(0, 1);
                }

                // Se o campo foi preenchido, avança para o próximo
                if (this.value.length === 1) {
                    // Adiciona classe de preenchido
                    this.classList.add('preencher');
                    avancarParaProximo(index);
                } else {
                    this.classList.remove('preencher');
                }

                verificarCampos();
            });

            // Evento de keydown: captura Backspace para voltar
            input.addEventListener('keydown', function(e) {
                // Se pressionou Backspace e o campo está vazio
                if (e.key === 'Backspace' && this.value === '') {
                    e.preventDefault();
                    voltarParaAnterior(index);
                    verificarCampos();
                }

                // Se pressionou uma tecla que não é número, bloqueia
                if (!/^[0-9]$/.test(e.key) && 
                    e.key !== 'Backspace' && 
                    e.key !== 'Tab' && 
                    e.key !== 'ArrowLeft' && 
                    e.key !== 'ArrowRight' && 
                    e.key !== 'Delete' && 
                    e.key !== 'Shift' && 
                    e.key !== 'Control' && 
                    e.key !== 'Alt' && 
                    !e.key.startsWith('Arrow')) {
                    e.preventDefault();
                }

                // Seta para navegar com setas
                if (e.key === 'ArrowLeft' && index > 0) {
                    inputs[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Evento de paste: permite colar um código completo
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedData = (e.clipboardData || window.clipboardData).getData('text');
                const numbers = pastedData.replace(/\D/g, '').slice(0, 6);

                for (let i = 0; i < numbers.length && i < inputs.length; i++) {
                    inputs[i].value = numbers[i];
                    if (numbers[i]) {
                        inputs[i].classList.add('preencher');
                    }
                }

                // Foca no próximo campo vazio
                for (let i = 0; i < inputs.length; i++) {
                    if (inputs[i].value === '') {
                        inputs[i].focus();
                        break;
                    }
                    if (i === inputs.length - 1) {
                        inputs[i].focus();
                    }
                }

                verificarCampos();
            });

            // Previne scroll no input number
            input.addEventListener('wheel', function(e) {
                e.preventDefault();
            });
        });

        // Formulário
        const formConfirmar = document.getElementById('formConfirmar');
        if (formConfirmar) {
            formConfirmar.addEventListener('submit', function(e) {
                e.preventDefault();

                // Pega o código completo
                const codigo = codigoCompleto.value;

                if (codigo.length !== 6) {
                    mostrarAviso('Digite o código completo, com os 6 dígitos recebidos por e-mail.', { titulo: 'Código incompleto' });
                    return;
                }

                const cpf = localStorage.getItem("cpfRecuperacao");
                if (!cpf) {
                    mostrarErro(
                        "A recuperação de senha expirou. Informe seu CPF novamente para receber um novo código.",
                        {
                            categoria: "Sessão",
                            titulo: "Recuperação expirada",
                            aoFechar: () => { window.location.href = "esqueci_senha.html"; }
                        }
                    );
                    return;
                }

                fetch("http://localhost:3000/auth/validar-codigo", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        cpf: cpf,
                        codigo: codigo
                    })

                })

                .then(async response => {

                    const dados = await response.json();

                    if (!response.ok) {
                        throw new Error(dados.msg);
                    }

                    return dados;

                })

                .then((dados) => {

                    // Token de uso único: a troca de senha só é aceita com ele.
                    // sessionStorage some quando a aba é fechada.
                    sessionStorage.setItem("tokenRecuperacao", dados.token);
                    window.location.href = "nova_senha.html";

                })

                .catch((erro) => {

                    mostrarErro(erro, { categoria: "Código inválido", titulo: "Não foi possível validar" });

                });
            });
        }

        // Reenviar código
        const reenviarBtn = document.getElementById('reenviarCodigo');
        if (reenviarBtn) {
            reenviarBtn.addEventListener('click', function() {
                mostrarSucesso("Um novo código foi enviado para o e-mail cadastrado.", { titulo: "Código reenviado" });
                // Limpa os campos
                inputs.forEach(input => {
                    input.value = '';
                    input.classList.remove('preencher');
                });
                inputs[0].focus();
                verificarCampos();
            });
        }

    })();
</script>
</body>
</html>
