<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HematoAI · Nova senha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #1a1f2c;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        :root {
            --medical-red: #b91c1c;
            --medical-red-dark: #991b1b;
            --medical-red-light: #fee2e2;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-700: #374151;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
            width: 100%;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 20px 0;
            border-bottom: 1px solid var(--gray-200);
            background-color: white;
        }

        .logo-link {
            text-decoration: none;
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease;
            border-radius: 12px;
            padding: 4px 8px 4px 4px;
            background: transparent;
        }
        .logo-link:hover {
            opacity: 0.85;
            background-color: var(--gray-50);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--medical-red);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
            font-family: monospace;
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--gray-900);
            position: relative;
            top: 4px;
        }

        .logo-text span {
            color: var(--medical-red);
        }

        .tagline {
            font-size: 0.8rem;
            color: var(--gray-700);
            margin-left: 6px;
            font-weight: 400;
            border-left: 1px solid var(--gray-300);
            padding-left: 10px;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--medical-red);
            color: var(--medical-red);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-outline:hover {
            background-color: var(--medical-red-light);
            border-color: var(--medical-red-dark);
            transform: translateY(-1px);
        }

        /* ========== FORMULÁRIO ========== */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .login-card {
            max-width: 460px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: var(--shadow-lg);
            padding: 40px 36px;
            border: 1px solid var(--gray-100);
            transition: transform 0.2s;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--gray-900);
            text-align: center;
        }

        .login-sub {
            text-align: center;
            color: var(--gray-700);
            font-size: 0.9rem;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--gray-200);
            display: inline-block;
            width: auto;
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--gray-700);
            letter-spacing: 0.3px;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding: 14px 50px 14px 18px;
            border: 1.5px solid var(--gray-200);
            border-radius: 20px;
            font-size: 1rem;
            transition: all 0.2s;
            font-family: inherit;
            background-color: white;
            outline: none;
            width: 100%;
        }

        .password-wrapper input:focus {
            border-color: var(--medical-red);
            box-shadow: 0 0 0 3px var(--medical-red-light);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-700);
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--gray-900);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .input-group .mensagem-erro {
            font-size: 0.8rem;
            color: var(--medical-red);
            margin-top: 4px;
            display: none;
        }

        .input-group .mensagem-erro.visivel {
            display: block;
        }

        .btn-entrar {
            width: 100%;
            background-color: var(--medical-red);
            border: none;
            color: white;
            padding: 14px 0;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 12px;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
        }

        .btn-entrar:hover {
            background-color: var(--medical-red-dark);
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            padding: 24px 0 20px;
            border-top: 1px solid var(--gray-200);
            font-size: 0.75rem;
            color: var(--gray-700);
            margin-top: 20px;
        }

        .bg-accent {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(185,28,28,0.02) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            z-index: -1;
        }

        @media (max-width: 600px) {
            .container { padding: 0 20px; }
            .header { flex-direction: row; flex-wrap: wrap; gap: 12px; }
            .logo-link { margin-right: auto; }
            .nav-buttons { margin-left: auto; }
            .login-card { padding: 32px 24px; }
            .login-title { font-size: 1.5rem; }
        }

        @media (max-width: 480px) {
            .logo-text { font-size: 1.2rem; }
            .tagline { display: none; }
            .btn-outline { padding: 6px 14px; font-size: 0.8rem; }
        }
    </style>
  <script src="../JS/erro-popup.js"></script>
</head>
<body>
<div class="bg-accent"></div>
<div class="container">
    <header class="header">
        <a href="telaInicial" class="logo-link" aria-label="Página inicial HematoAI">
            <div class="logo-icon">H</div>
            <div class="logo-text">Hemato<span>AI</span></div>
            <div class="tagline">Inteligência em Hematologia</div>
        </a>
        <div class="nav-buttons">
            <button class="btn-outline" id="btnContatoLogin" aria-label="Contato profissional">
                Contato
            </button>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <div class="login-title">Nova senha</div>
            <div style="text-align: center; margin-bottom: 28px;">
                <span class="login-sub">Cadastre sua nova senha.</span>
            </div>

            <form id="formNovaSenha" action="#" method="post">
                <div class="input-group">
                    <label for="novaSenha">Nova senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="novaSenha" name="novaSenha" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="toggleSenha('novaSenha', this)" aria-label="Mostrar/ocultar senha">
                            <svg viewBox="0 0 24 24" id="eyeIconNovaSenha">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="toggleSenha('confirmarSenha', this)" aria-label="Mostrar/ocultar senha">
                            <svg viewBox="0 0 24 24" id="eyeIconConfirmarSenha">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="mensagem-erro" id="erroSenha"></div>
                </div>

                <button type="submit" class="btn-entrar">Salvar nova senha</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>HematoAI · Sistema de apoio ao diagnóstico hematológico · Segurança e confidencialidade</p>
    </footer>
</div>
<script>
    (function() {
        // Contato
        const btnContato = document.getElementById('btnContatoLogin');
        if (btnContato) {
            btnContato.addEventListener('click', () => {
                mostrarInfo(
                    "Central de suporte: contato@hematoai.com.br | Telefone: (11) 4000-1234. Segunda a sexta, 8h-18h.",
                    { categoria: "Contato", titulo: "Fale com o suporte" }
                );
            });
        }

        // Função toggle senha com ícone SVG profissional
        window.toggleSenha = function(inputId, button) {
            const input = document.getElementById(inputId);
            if (!input) return;

            const svg = button.querySelector('svg');
            const isPassword = input.type === 'password';

            if (isPassword) {
                input.type = 'text';
                // Olho aberto (com risco)
                svg.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
            } else {
                input.type = 'password';
                // Olho fechado (sem risco)
                svg.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        };

        // Formulário
        const formNovaSenha = document.getElementById('formNovaSenha');
        const erroSenha = document.getElementById('erroSenha');

        if (formNovaSenha) {
            formNovaSenha.addEventListener('submit', function(e) {
                e.preventDefault();

                const novaSenha = document.getElementById('novaSenha').value;
                const confirmarSenha = document.getElementById('confirmarSenha').value;
                let isValid = true;

                // Limpa erro anterior
                erroSenha.textContent = '';
                erroSenha.classList.remove('visivel');

                // Validações
                if (novaSenha.length < 8) {
                    erroSenha.textContent = 'A senha deve possuir pelo menos 8 caracteres.';
                    erroSenha.classList.add('visivel');
                    isValid = false;
                } else if (novaSenha !== confirmarSenha) {
                    erroSenha.textContent = 'As senhas não coincidem.';
                    erroSenha.classList.add('visivel');
                    isValid = false;
                }

                if (!isValid) {
                    return;
                }

                const cpf = localStorage.getItem("cpfRecuperacao");
                const token = sessionStorage.getItem("tokenRecuperacao");

                // Sem código validado nesta aba não há como trocar a senha.
                if (!cpf || !token) {
                    mostrarAviso(
                        "Para redefinir a senha, solicite um código e confirme-o antes de escolher a nova senha.",
                        {
                            titulo: "Verificação necessária",
                            aoFechar: () => { window.location.href = "esqueci_senha.html"; }
                        }
                    );
                    return;
                }

                fetch("http://localhost:3000/auth/alterar-senha-recuperacao", {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify({

                        cpf: cpf,

                        token: token,

                        novaSenha: novaSenha

                    })

                })

                .then(res => res.json())

                .then(dados => {

                    if(dados.status){

                        localStorage.removeItem("cpfRecuperacao");
                        sessionStorage.removeItem("tokenRecuperacao");

                        mostrarSucesso(
                            "Sua senha foi alterada. Entre novamente com a nova senha.",
                            {
                                titulo: "Senha alterada",
                                aoFechar: () => { window.location.href = "../login.html"; }
                            }
                        );

                    }else{

                        // Token vencido/já usado: o único caminho é pedir outro código.
                        const expirou = /verifica[çc][ãa]o do c[óo]digo expirou/i.test(dados.msg || "");
                        if (expirou) sessionStorage.removeItem("tokenRecuperacao");

                        mostrarErro(dados.msg, {
                            titulo: "Não foi possível alterar a senha",
                            aoFechar: expirou ? () => { window.location.href = "esqueci_senha.html"; } : undefined
                        });

                    }

                })

                .catch((erro) =>{

                    mostrarErro(erro, { titulo: "Não foi possível alterar a senha" });

                });
            });
        }

        // Limpar erro ao digitar
        const novaSenhaInput = document.getElementById('novaSenha');
        const confirmarSenhaInput = document.getElementById('confirmarSenha');

        if (novaSenhaInput) {
            novaSenhaInput.addEventListener('input', function() {
                erroSenha.classList.remove('visivel');
            });
        }

        if (confirmarSenhaInput) {
            confirmarSenhaInput.addEventListener('input', function() {
                erroSenha.classList.remove('visivel');
            });
        }
    })();
</script>
</body>
</html>
