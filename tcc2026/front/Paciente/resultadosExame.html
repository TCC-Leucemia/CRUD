<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="../JS/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HematoAI · Resultados de Exames</title>
  <link rel="stylesheet" href="../CSS/navbar.css">
  <style>
    /* ── Layout principal ───────────────────────────────── */
    .resultados-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Indicadores ────────────────────────────────────── */
    .stats-indicators {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-indicator-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 18px;
      text-align: center;
    }

    .stat-indicator-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--red);
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-indicator-label {
      font-size: 0.8rem;
      color: var(--text-2);
      font-weight: 500;
    }

    /* ── Área de pesquisa e filtros ────────────────────── */
    .filtros-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .filtros-area .search-wrapper {
      flex: 2;
      min-width: 180px;
      position: relative;
    }

    .filtros-area .search-wrapper input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 0.85rem;
      background: var(--bg);
      color: var(--text-1);
      outline: none;
      transition: var(--transition);
    }

    .filtros-area .search-wrapper input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.08);
    }

    .filtros-area .search-wrapper .lupa {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: var(--text-3);
    }

    .filtros-area .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filtros-area select {
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 0.8rem;
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--font);
      outline: none;
      cursor: pointer;
      transition: var(--transition);
      min-width: 110px;
    }

    .filtros-area select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.08);
    }

    /* ── Lista de resultados em barras ──────────────────── */
    .resultados-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .resultado-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: var(--transition);
      gap: 12px;
      flex-wrap: wrap;
    }

    .resultado-linha:hover {
      background: var(--bg);
      border-color: var(--border-dark);
      box-shadow: var(--shadow-sm);
    }

    .resultado-linha .info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 180px;
    }

    .resultado-linha .info .tipo {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-1);
    }

    .resultado-linha .info .data {
      font-size: 0.8rem;
      color: var(--text-3);
      white-space: nowrap;
    }

    .resultado-linha .badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .resultado-linha .badges .badge-status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-status.finalizado { background: #dcfce7; color: #15803d; }
    .badge-status.analise   { background: #dbeafe; color: #2563eb; }
    .badge-status.pendente  { background: #fef3c7; color: #d97706; }

    .resultado-linha .badges .badge-suspeita {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-suspeita.sem       { background: #dcfce7; color: #15803d; }
    .badge-suspeita.baixa     { background: #dbeafe; color: #2563eb; }
    .badge-suspeita.moderada  { background: #fef3c7; color: #d97706; }
    .badge-suspeita.alta      { background: #fee2e2; color: #dc2626; }

    .resultado-linha .btn-ver {
      flex-shrink: 0;
    }

    /* ── Nenhum resultado ───────────────────────────────── */
    .nenhum-resultado {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      text-align: center;
    }
    .nenhum-resultado .icone {
      font-size: 3.5rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .nenhum-resultado h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 6px;
    }
    .nenhum-resultado p {
      color: var(--text-3);
      font-size: 0.85rem;
    }

    /* ── Modal de detalhes ─────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 32px;
      transform: scale(0.96);
      transition: transform 0.25s ease;
    }
    .modal-overlay.open .modal-content {
      transform: scale(1);
    }

    .modal-content .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .modal-content .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      margin: 0;
    }

    .modal-content .modal-header .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-2);
      transition: var(--transition);
      line-height: 1;
    }
    .modal-content .modal-header .close-btn:hover {
      color: var(--red);
    }

    .modal-content .modal-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-content .modal-body .linha {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .modal-content .modal-body .linha:last-child {
      border-bottom: none;
    }
    .modal-content .modal-body .linha .label {
      color: var(--text-2);
      font-weight: 600;
    }
    .modal-content .modal-body .linha .valor {
      color: var(--text-1);
      font-weight: 500;
      text-align: right;
      max-width: 60%;
    }

    .modal-content .modal-body .resultado-box {
      background: var(--bg);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      border-left: 4px solid var(--blue);
      margin-top: 4px;
    }
    .modal-content .modal-body .resultado-box .label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .modal-content .modal-body .resultado-box .texto {
      font-size: 0.9rem;
      color: var(--text-1);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .modal-content .modal-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* ── Modo escuro ────────────────────────────────────── */
    .dark-mode .resultado-linha {
      background: var(--surface);
      border-color: var(--border);
    }
    .dark-mode .resultado-linha:hover {
      background: var(--bg);
    }
    .dark-mode .badge-status.finalizado { background: #064e3b; color: #6ee7b7; }
    .dark-mode .badge-status.analise   { background: #1e3a8a; color: #93c5fd; }
    .dark-mode .badge-status.pendente  { background: #78350f; color: #fcd34d; }
    .dark-mode .badge-suspeita.sem       { background: #064e3b; color: #6ee7b7; }
    .dark-mode .badge-suspeita.baixa     { background: #1e3a8a; color: #93c5fd; }
    .dark-mode .badge-suspeita.moderada  { background: #78350f; color: #fcd34d; }
    .dark-mode .badge-suspeita.alta      { background: #7f1d1d; color: #fca5a5; }
    .dark-mode .modal-content .modal-body .linha {
      border-bottom-color: var(--border);
    }
    .dark-mode .modal-content .resultado-box {
      background: var(--surface);
      border-left-color: var(--blue);
    }
    .dark-mode .filtros-area {
      background: var(--surface);
      border-color: var(--border);
    }
    .dark-mode .filtros-area select {
      background: var(--bg);
      border-color: var(--border);
      color: var(--text-1);
    }
    .dark-mode .filtros-area .search-wrapper input {
      background: var(--bg);
      border-color: var(--border);
      color: var(--text-1);
    }
    .dark-mode .filtros-area .search-wrapper input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }
    .dark-mode .nenhum-resultado {
      background: var(--surface);
      border-color: var(--border);
    }

    /* ── Responsividade ────────────────────────────────── */
    @media (max-width: 1024px) {
      .stats-indicators { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .filtros-area {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .filtros-area .filter-group {
        flex-wrap: wrap;
      }
      .filtros-area select {
        flex: 1;
        min-width: 0;
      }
      .resultado-linha {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 12px 14px;
      }
      .resultado-linha .info {
        flex-wrap: wrap;
        gap: 6px;
      }
      .resultado-linha .badges {
        flex-wrap: wrap;
      }
      .resultado-linha .btn-ver {
        align-self: flex-end;
      }
    }
    @media (max-width: 600px) {
      .stats-indicators { grid-template-columns: 1fr; }
      .modal-content {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle">☰</button>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Resultados de Exames</h1>
        <p>Consultar todos os resultados de exames realizados</p>
      </div>
      <div class="page-header-right">
        <span class="badge badge-green">Paciente</span>
      </div>
    </div>

    <div class="page-body">
      <div class="resultados-container">

        <!-- ─── INDICADORES ────────────────────────────────── -->
        <div class="stats-indicators">
          <div class="stat-indicator-card">
            <div class="stat-indicator-number" id="totalExames">0</div>
            <div class="stat-indicator-label">Total de exames</div>
          </div>
          <div class="stat-indicator-card">
            <div class="stat-indicator-number" id="resultadosDisponiveis">0</div>
            <div class="stat-indicator-label">Resultados disponíveis</div>
          </div>
          <div class="stat-indicator-card">
            <div class="stat-indicator-number" id="emAnalise">0</div>
            <div class="stat-indicator-label">Em análise</div>
          </div>
          <div class="stat-indicator-card">
            <div class="stat-indicator-number" id="finalizados">0</div>
            <div class="stat-indicator-label">Finalizados</div>
          </div>
        </div>

        <!-- ─── ÁREA DE PESQUISA E FILTROS ────────────────── -->
        <div class="filtros-area">
          <div class="search-wrapper">
            <span class="lupa">🔍</span>
            <input type="text" id="searchInput" placeholder="Buscar por tipo de exame ou data...">
          </div>
          <div class="filter-group">
            <select id="filtroTipo">
              <option value="">Todos os tipos</option>
              <option value="Hemograma">Hemograma</option>
              <option value="Mielograma">Mielograma</option>
              <option value="Esfregaço">Esfregaço</option>
              <option value="Imunofenotipagem">Imunofenotipagem</option>
              <option value="Citometria">Citometria</option>
            </select>
            <select id="filtroStatus">
              <option value="">Todos os status</option>
              <option value="Finalizado">Finalizado</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Pendente">Pendente</option>
            </select>
            <select id="filtroOrdenacao">
              <option value="recentes">Mais recentes</option>
              <option value="antigos">Mais antigos</option>
              <option value="tipo-asc">Tipo A-Z</option>
              <option value="tipo-desc">Tipo Z-A</option>
            </select>
          </div>
        </div>

        <!-- ─── LISTA DE RESULTADOS (BARRAS) ────────────────── -->
        <div id="listaResultados" class="resultados-list"></div>

      </div><!-- /resultados-container -->
    </div><!-- /page-body -->
  </div><!-- /main-content -->
</div><!-- /app-layout -->

<!-- ─── MODAL DE DETALHES ──────────────────────────────────── -->
<div class="modal-overlay" id="modalDetalhes">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitulo">Detalhes do Exame</h2>
      <button class="close-btn" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- preenchido via JavaScript -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modalFecharBtn">Fechar</button>
      <button class="btn btn-outline" id="modalExportarBtn">📄 Exportar PDF</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../JS/navbar.js"></script>
<script src="../JS/auth.js"></script>
<script>
  // ============================================================
  //  CÓDIGO EXISTENTE (preservado integralmente)
  // ============================================================

  let EXAMES = [];

  async function carregarExames() {
    try {
      const token = localStorage.getItem("token");
      const response = await fetch("http://localhost:3000/exames", {
        headers: { Authorization: "Bearer " + token }
      });
      const dados = await response.json();
      if (!dados.status) {
        HematoAI.showToast("Erro ao carregar exames", "error");
        return;
      }
      EXAMES = dados.dados;
      console.log(EXAMES);
    } catch (e) {
      console.error(e);
      HematoAI.showToast("Erro ao carregar exames", "error");
    }
  }

  function atualizarIndicadores() {
    const resultados = EXAMES.filter(e => e.resultado_texto);
    document.getElementById("totalExames").textContent = EXAMES.length;
    document.getElementById("resultadosDisponiveis").textContent = resultados.length;
    document.getElementById("emAnalise").textContent = EXAMES.filter(e => e.statusc === "Em andamento").length;
  }

  function atualizarFinalizados() {
    const finalizados = EXAMES.filter(e => e.statusc === "Finalizado").length;
    document.getElementById("finalizados").textContent = finalizados;
  }

  function classeStatus(status) {
    switch (status) {
      case "Finalizado": return "finalizado";
      case "Em andamento": return "analise";
      default: return "pendente";
    }
  }

  // ============================================================
  //  RENDERIZAÇÃO EM LISTA (SEM ÍCONES)
  // ============================================================

  function renderizarLista(dados) {
    const lista = document.getElementById("listaResultados");
    lista.innerHTML = "";

    if (dados.length === 0) {
      lista.innerHTML = `
        <div class="nenhum-resultado">
          <div class="icone">📂</div>
          <h3>Nenhum resultado disponível</h3>
          <p>Assim que um exame for finalizado, ele aparecerá aqui.</p>
        </div>
      `;
      return;
    }

    dados.forEach(exame => {
      const dataExame = exame.data_exame
        ? new Date(exame.data_exame).toLocaleDateString("pt-BR")
        : "Data não disponível";

      const suspeitaMap = {
        'Sem suspeita': 'sem',
        'Baixa': 'baixa',
        'Moderada': 'moderada',
        'Alta': 'alta'
      };
      const classeSuspeita =
      suspeitaMap[exame.suspeita_leucemia] || 'sem';

      const suspeitaLabel =
      exame.suspeita_leucemia || 'Sem suspeita';

      const linha = document.createElement('div');
      linha.className = 'resultado-linha';

      linha.innerHTML = `
        <div class="info">
          <span class="tipo">${exame.tipo_exame || "Exame"}</span>
          <span class="data">${dataExame}</span>
        </div>
        <div class="badges">
          <span class="badge-status ${classeStatus(exame.statusc)}">${exame.statusc || "Pendente"}</span>
          <span class="badge-suspeita ${classeSuspeita}">${suspeitaLabel}</span>
        </div>
        <div class="btn-ver">
          <button class="btn btn-ghost btn-sm" onclick="abrirModal(${exame.id_exame})">Visualizar</button>
        </div>
      `;

      lista.appendChild(linha);
    });
  }

  // ============================================================
  //  MODAL DE DETALHES
  // ============================================================

  function abrirModal(idExame) {
    const exame = EXAMES.find(e => e.id_exame === idExame);
    if (!exame) return;

    const modal = document.getElementById('modalDetalhes');
    const body = document.getElementById('modalBody');
    const titulo = document.getElementById('modalTitulo');

    titulo.textContent = exame.tipo_exame || 'Exame';

    const dataExame = exame.data_exame
      ? new Date(exame.data_exame).toLocaleDateString("pt-BR")
      : "Não disponível";
    const dataResultado = exame.data_resultado
      ? new Date(exame.data_resultado).toLocaleDateString("pt-BR")
      : "Não disponível";

    const suspeitaMap = {
      'Sem suspeita': 'sem',
      'Baixa': 'baixa',
      'Moderada': 'moderada',
      'Alta': 'alta'
    };
    const classeSuspeita =
      suspeitaMap[exame.suspeita_leucemia] || 'sem';

    const suspeitaLabel =
        exame.suspeita_leucemia || 'Sem suspeita';

    body.innerHTML = `
      <div class="resultado-box">
        <div class="label">Resultado</div>
        <div class="texto">${exame.resultado_texto || 'Resultado ainda não disponível.'}</div>
      </div>

      <div class="linha"><span class="label">Médico</span><span class="valor">${exame.medico || 'Não informado'}</span></div>
      <div class="linha"><span class="label">Especialidade</span><span class="valor">${exame.especialidade || 'Não informado'}</span></div>
      <div class="linha"><span class="label">Status</span><span class="valor"><span class="badge-status ${classeStatus(exame.statusc)}">${exame.statusc || 'Pendente'}</span></span></div>
      <div class="linha"><span class="label">Suspeita</span><span class="valor"><span class="badge-suspeita ${classeSuspeita}">${suspeitaLabel}</span></span></div>
      <div class="linha"><span class="label">Tipo de leucemia</span><span class="valor">${exame.tipo_leucemia || 'Não identificado'}</span></div>
      <div class="linha"><span class="label">Data do exame</span><span class="valor">${dataExame}</span></div>
      <div class="linha"><span class="label">Data do resultado</span><span class="valor">${dataResultado}</span></div>
    `;

    modal.dataset.exameId = idExame;
    modal.classList.add('open');
  }

  function fecharModal() {
    document.getElementById('modalDetalhes').classList.remove('open');
  }

  // Eventos do modal
  document.getElementById('modalCloseBtn').addEventListener('click', fecharModal);
  document.getElementById('modalFecharBtn').addEventListener('click', fecharModal);
  document.getElementById('modalDetalhes').addEventListener('click', function(e) {
    if (e.target === this) fecharModal();
  });

  document.getElementById('modalExportarBtn').addEventListener('click', function() {
    const id = document.getElementById('modalDetalhes').dataset.exameId;
    if (id) {
      HematoAI.showToast('Exportando PDF do exame #' + id, 'info');
    }
  });

  // ============================================================
  //  FILTROS E ORDENAÇÃO
  // ============================================================

  function filtrarResultados() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const tipo = document.getElementById('filtroTipo').value;
    const status = document.getElementById('filtroStatus').value;
    const ordenacao = document.getElementById('filtroOrdenacao').value;

    let filtrados = EXAMES.filter(e => e.resultado_texto);

    if (search) {
      filtrados = filtrados.filter(e => {
        const tipoMatch = (e.tipo_exame || '').toLowerCase().includes(search);
        const dataMatch = e.data_exame
          ? new Date(e.data_exame).toLocaleDateString('pt-BR').includes(search)
          : false;
        return tipoMatch || dataMatch;
      });
    }

    if (tipo) {
      filtrados = filtrados.filter(e => e.tipo_exame === tipo);
    }

    if (status) {
      filtrados = filtrados.filter(e => e.statusc === status);
    }

    switch (ordenacao) {
      case 'recentes':
        filtrados.sort((a, b) => new Date(b.data_exame) - new Date(a.data_exame));
        break;
      case 'antigos':
        filtrados.sort((a, b) => new Date(a.data_exame) - new Date(b.data_exame));
        break;
      case 'tipo-asc':
        filtrados.sort((a, b) => (a.tipo_exame || '').localeCompare(b.tipo_exame || ''));
        break;
      case 'tipo-desc':
        filtrados.sort((a, b) => (b.tipo_exame || '').localeCompare(a.tipo_exame || ''));
        break;
      default:
        break;
    }

    renderizarLista(filtrados);
  }

  const usuario = JSON.parse(localStorage.getItem("usuario"));

  if (!usuario || usuario.role !== "Paciente") {
    window.location.href = "../login.html";
  }

  

  if (typeof HematoAI !== 'undefined' && HematoAI.initSidebar) {
    HematoAI.initSidebar('resultados');
  } else {
    console.warn("HematoAI não definido. Verifique o arquivo JS/navbar.js");
  }

  window.onload = async () => {
    verificarPerfil("Paciente");

    await carregarExames();

    atualizarIndicadores();
    atualizarFinalizados();

    const todosResultados = EXAMES.filter(e => e.resultado_texto);
    renderizarLista(todosResultados);

    document.getElementById('searchInput').addEventListener('input', filtrarResultados);
    document.getElementById('filtroTipo').addEventListener('change', filtrarResultados);
    document.getElementById('filtroStatus').addEventListener('change', filtrarResultados);
    document.getElementById('filtroOrdenacao').addEventListener('change', filtrarResultados);
  };
</script>
</body>
</html>
