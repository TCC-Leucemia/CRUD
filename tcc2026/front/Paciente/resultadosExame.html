<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="../JS/theme-init.js"></script>
  <script src="../JS/erro-popup.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HematoAI · Resultados de Exames</title>
  <link rel="stylesheet" href="../CSS/navbar.css">
  <style>
    /* ── Layout principal ───────────────────────────────── */
    .resultados-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Área de pesquisa e filtros ────────────────────── */
    .filtros-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .filtros-area .search-wrapper {
      flex: 2;
      min-width: 180px;
      position: relative;
    }

    .filtros-area .search-wrapper input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 0.85rem;
      background: var(--bg);
      color: var(--text-1);
      outline: none;
      transition: var(--transition);
      line-height: 1;
      text-align: left;
    }

    .filtros-area .search-wrapper input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.08);
    }

    .filtros-area .search-wrapper .lupa {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: var(--text-3);
    }

    .filtros-area .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filtros-area select {
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 0.8rem;
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--font);
      outline: none;
      cursor: pointer;
      transition: var(--transition);
      min-width: 110px;
      line-height: 1;
      text-align: center;
      text-align-last: center;
    }

    .filtros-area select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.08);
    }

    /* Os botões de PDF/Excel entram nesta mesma área (ver criarBotoes mais
       abaixo): só o padding muda aqui, para ficar da altura dos outros
       filtros da barra; a fonte fica a padrão do navbar.css (maior que a
       de todos os filtros desta página, inclusive a busca a 0.85rem). */
    .filtros-area .btn-export {
      padding: 8px 14px;
    }

    /* ── Lista de resultados em cards ──────────────────── */
    .resultados-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .resultado-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .resultado-card:hover {
      background: var(--bg);
      border-color: var(--border-dark);
      box-shadow: var(--shadow-md);
    }

    .resultado-card .info-principal {
      flex: 1;
      min-width: 180px;
    }

    .resultado-card .info-principal .tipo {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-1);
      margin-bottom: 4px;
      display: block;
    }

    .resultado-card .info-principal .data {
      font-size: 0.8rem;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .resultado-card .badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge-status,
    .badge-suspeita {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .badge-status.finalizado { background: #dcfce7; color: #15803d; }
    .badge-status.analise   { background: #dbeafe; color: #2563eb; }
    .badge-status.pendente  { background: #fef3c7; color: #d97706; }

    .badge-suspeita.sem       { background: #dcfce7; color: #15803d; }
    .badge-suspeita.baixa     { background: #dbeafe; color: #2563eb; }
    .badge-suspeita.moderada  { background: #fef3c7; color: #d97706; }
    .badge-suspeita.alta      { background: #fee2e2; color: #dc2626; }

    .resultado-card .acao {
      flex-shrink: 0;
    }

    /* ── Nenhum resultado ───────────────────────────────── */
    .nenhum-resultado {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      text-align: center;
    }
    .nenhum-resultado .icone {
      font-size: 3.5rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .nenhum-resultado h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 6px;
    }
    .nenhum-resultado p {
      color: var(--text-3);
      font-size: 0.85rem;
    }

    /* ── Modal de detalhes ─────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 32px;
      transform: scale(0.96);
      transition: transform 0.25s ease;
    }
    .modal-overlay.open .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .modal-header .modal-titulo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-1);
      margin: 0;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .modal-header .modal-subtitulo {
      font-size: 0.8rem;
      color: var(--text-3);
      margin-top: 4px;
    }

    .modal-header .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-2);
      transition: var(--transition);
      line-height: 1;
      padding: 4px;
      border-radius: 50%;
    }
    .modal-header .close-btn:hover {
      color: var(--red);
      background: rgba(185, 28, 28, 0.05);
    }

    /* Destaque do resultado */
    .resultado-destaque {
      background: var(--bg);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      border-left: 5px solid var(--blue);
      margin-bottom: 24px;
    }
    .resultado-destaque .label-destaque {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-3);
      margin-bottom: 8px;
      display: block;
    }
    .resultado-destaque .texto-destaque {
      font-size: 1rem;
      color: var(--text-1);
      line-height: 1.7;
      white-space: pre-wrap;
      font-weight: 500;
    }

    /* Grade de informações */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 24px;
      margin-bottom: 24px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }
    .info-item:last-child {
      border-bottom: none;
    }

    .info-item .label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-3);
    }
    .info-item .valor {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* ── Modo escuro ────────────────────────────────────── */
    .dark-mode .resultado-card {
      background: var(--surface);
      border-color: var(--border);
    }
    .dark-mode .resultado-card:hover {
      background: var(--bg);
    }
    .dark-mode .badge-status.finalizado { background: #064e3b; color: #6ee7b7; }
    .dark-mode .badge-status.analise   { background: #1e3a8a; color: #93c5fd; }
    .dark-mode .badge-status.pendente  { background: #78350f; color: #fcd34d; }
    .dark-mode .badge-suspeita.sem       { background: #064e3b; color: #6ee7b7; }
    .dark-mode .badge-suspeita.baixa     { background: #1e3a8a; color: #93c5fd; }
    .dark-mode .badge-suspeita.moderada  { background: #78350f; color: #fcd34d; }
    .dark-mode .badge-suspeita.alta      { background: #7f1d1d; color: #fca5a5; }
    .dark-mode .modal-content .resultado-destaque {
      background: var(--surface);
      border-left-color: var(--blue);
    }
    .dark-mode .info-item {
      border-bottom-color: var(--border);
    }
    .dark-mode .filtros-area {
      background: var(--surface);
      border-color: var(--border);
    }
    .dark-mode .filtros-area select {
      background: var(--bg);
      border-color: var(--border);
      color: var(--text-1);
    }
    .dark-mode .filtros-area .search-wrapper input {
      background: var(--bg);
      border-color: var(--border);
      color: var(--text-1);
    }
    .dark-mode .filtros-area .search-wrapper input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }
    .dark-mode .nenhum-resultado {
      background: var(--surface);
      border-color: var(--border);
    }

    /* ── Responsividade ────────────────────────────────── */
    @media (max-width: 768px) {
      .filtros-area {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .filtros-area .filter-group {
        flex-wrap: wrap;
      }
      .filtros-area select {
        flex: 1;
        min-width: 0;
      }
      .resultado-card {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 14px 16px;
      }
      .resultado-card .info-principal {
        min-width: auto;
      }
      .resultado-card .acao {
        align-self: flex-end;
      }
      .info-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
    @media (max-width: 600px) {
      .modal-content {
        padding: 20px 16px;
      }
      .modal-header .modal-titulo {
        font-size: 1.2rem;
      }
      .resultado-destaque {
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle">☰</button>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Resultados de Exames</h1>
        <p>Consultar todos os resultados de exames realizados</p>
      </div>
      <div class="page-header-right">
        <span class="badge badge-green">Paciente</span>
      </div>
    </div>

    <div class="page-body">
      <div class="resultados-container">

        <!-- ─── ÁREA DE PESQUISA E FILTROS ────────────────── -->
        <div class="filtros-area">
          <div class="search-wrapper">
            <span class="lupa">🔍</span>
            <input type="text" id="searchInput" placeholder="Buscar por tipo de exame ou data...">
          </div>
          <div class="filter-group">
            <select id="filtroTipo">
              <option value="">Todos</option>
              <option value="Hemograma">Hemograma</option>
              <option value="Mielograma">Mielograma</option>
            </select>
            <select id="filtroStatus">
              <option value="">Todos os status</option>
              <option value="Finalizado">Finalizado</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Pendente">Pendente</option>
            </select>
            <select id="filtroOrdenacao">
              <option value="recentes">Mais recentes</option>
              <option value="antigos">Mais antigos</option>
            </select>
          </div>
        </div>

        <!-- ─── LISTA DE RESULTADOS (CARDS) ────────────────── -->
        <div id="listaResultados" class="resultados-list"></div>

      </div><!-- /resultados-container -->
    </div><!-- /page-body -->
  </div><!-- /main-content -->
</div><!-- /app-layout -->

<!-- ─── MODAL DE DETALHES ──────────────────────────────────── -->
<div class="modal-overlay" id="modalDetalhes">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <h2 class="modal-titulo" id="modalTitulo">Detalhes do Exame</h2>
        <div class="modal-subtitulo" id="modalSubtitulo">Exame realizado</div>
      </div>
      <button class="close-btn" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- preenchido via JavaScript -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modalFecharBtn">Fechar</button>
      <button class="btn btn-export btn-export-pdf" id="modalExportarBtn"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>Exportar PDF</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../JS/navbar.js"></script>
<script src="../JS/auth.js"></script>
<script src="../JS/exportar.js"></script>
<script>
  // ============================================================
  //  CÓDIGO EXISTENTE (preservado, com ajustes solicitados)
  // ============================================================

  let EXAMES = [];
  let listaExibida = []; // exatamente os cards na tela, para a exportação

  async function carregarExames() {
    try {
      const token = localStorage.getItem("token");
      const response = await fetch("http://localhost:3000/exames", {
        headers: { Authorization: "Bearer " + token }
      });
      const dados = await response.json();
      if (!dados.status) {
        HematoAI.showToast("Erro ao carregar exames", "error");
        return;
      }
      EXAMES = dados.dados;
      console.log(EXAMES);
    } catch (e) {
      console.error(e);
      HematoAI.showToast("Erro ao carregar exames", "error");
    }
  }

  function classeStatus(status) {
    switch (status) {
      case "Finalizado": return "finalizado";
      case "Em andamento": return "analise";
      default: return "pendente";
    }
  }

  // ============================================================
  //  RENDERIZAÇÃO EM CARDS (MELHORADA)
  // ============================================================

  function renderizarLista(dados) {
    const lista = document.getElementById("listaResultados");
    lista.innerHTML = "";
    listaExibida = dados;

    if (dados.length === 0) {
      lista.innerHTML = `
        <div class="nenhum-resultado">
          <div class="icone">📂</div>
          <h3>Nenhum resultado disponível</h3>
          <p>Assim que um exame for finalizado, ele aparecerá aqui.</p>
        </div>
      `;
      return;
    }

    dados.forEach(exame => {
      const dataExame = exame.data_exame
        ? new Date(exame.data_exame).toLocaleDateString("pt-BR")
        : "Data não disponível";

      const suspeitaMap = {
        'Sem suspeita': 'sem',
        'Baixa': 'baixa',
        'Moderada': 'moderada',
        'Alta': 'alta'
      };
      const classeSuspeita = suspeitaMap[exame.suspeita_leucemia] || 'sem';
      const suspeitaLabel = exame.suspeita_leucemia || 'Sem suspeita';

      const card = document.createElement('div');
      card.className = 'resultado-card';

      card.innerHTML = `
        <div class="info-principal">
          <span class="tipo">${exame.tipo_exame || "Exame"}</span>
          <span class="data">📅 ${dataExame}</span>
        </div>
        <div class="badges">
          <span class="badge-status ${classeStatus(exame.statusc)}">${exame.statusc || "Pendente"}</span>
          <span class="badge-suspeita ${classeSuspeita}">${suspeitaLabel}</span>
        </div>
        <div class="acao">
          <button class="btn btn-ghost btn-sm" onclick="abrirModal(${exame.id_exame})">Visualizar</button>
        </div>
      `;

      lista.appendChild(card);
    });
  }

  // ============================================================
  //  MODAL DE DETALHES (REDESENHADO, INCLUI CRM)
  // ============================================================

  function abrirModal(idExame) {
    const exame = EXAMES.find(e => e.id_exame === idExame);
    if (!exame) return;
    console.log("EXAME SELECIONADO:", exame);
    console.log("CRM:", exame.crm);

    const modal = document.getElementById('modalDetalhes');
    const body = document.getElementById('modalBody');
    const titulo = document.getElementById('modalTitulo');
    const subtitulo = document.getElementById('modalSubtitulo');

    titulo.textContent = exame.tipo_exame || 'Exame';
    subtitulo.textContent = exame.data_exame
      ? 'Exame realizado em ' + new Date(exame.data_exame).toLocaleDateString("pt-BR")
      : 'Data não disponível';

    const dataExame = exame.data_exame
      ? new Date(exame.data_exame).toLocaleDateString("pt-BR")
      : "Não disponível";
    const dataResultado = exame.data_resultado
      ? new Date(exame.data_resultado).toLocaleDateString("pt-BR")
      : "Não disponível";

    const suspeitaMap = {
      'Sem suspeita': 'sem',
      'Baixa': 'baixa',
      'Moderada': 'moderada',
      'Alta': 'alta'
    };
    const classeSuspeita = suspeitaMap[exame.suspeita_leucemia] || 'sem';
    const suspeitaLabel = exame.suspeita_leucemia || 'Sem suspeita';

    body.innerHTML = `
      <div class="resultado-destaque">
        <span class="label-destaque">Resultado do exame</span>
        <div class="texto-destaque">${exame.resultado_texto || 'Resultado ainda não disponível.'}</div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <span class="label">Médico</span>
          <span class="valor">${exame.medico || 'Não informado'}</span>
        </div>
        <div class="info-item">
          <span class="label">CRM</span>
          <span class="valor">${exame.crm || 'Não informado'}</span>
        </div>
        <div class="info-item">
          <span class="label">Especialidade</span>
          <span class="valor">${exame.especialidade || 'Não informado'}</span>
        </div>
        <div class="info-item">
          <span class="label">Status</span>
          <span class="valor">
            <span class="badge-status ${classeStatus(exame.statusc)}">${exame.statusc || 'Pendente'}</span>
          </span>
        </div>
        <div class="info-item">
          <span class="label">Suspeita</span>
          <span class="valor">
            <span class="badge-suspeita ${classeSuspeita}">${suspeitaLabel}</span>
          </span>
        </div>
        <div class="info-item">
          <span class="label">Tipo de leucemia</span>
          <span class="valor">${exame.tipo_leucemia || 'Não identificado'}</span>
        </div>
        <div class="info-item">
          <span class="label">Data do exame</span>
          <span class="valor">${dataExame}</span>
        </div>
        <div class="info-item">
          <span class="label">Data do resultado</span>
          <span class="valor">${dataResultado}</span>
        </div>
      </div>
    `;

    modal.dataset.exameId = idExame;
    modal.classList.add('open');
  }

  function fecharModal() {
    document.getElementById('modalDetalhes').classList.remove('open');
  }

  // Eventos do modal
  document.getElementById('modalCloseBtn').addEventListener('click', fecharModal);
  document.getElementById('modalFecharBtn').addEventListener('click', fecharModal);
  document.getElementById('modalDetalhes').addEventListener('click', function(e) {
    if (e.target === this) fecharModal();
  });

  const formatarDataExport = (iso) => iso ? new Date(iso).toLocaleDateString('pt-BR') : 'Não disponível';

  // Ficha em PDF do exame aberto no modal.
  document.getElementById('modalExportarBtn').addEventListener('click', function() {
    const id = Number(document.getElementById('modalDetalhes').dataset.exameId);
    const exame = EXAMES.find(e => e.id_exame === id);
    if (!exame) return;

    HematoExport.exportarFichaPDF({
      titulo: `Resultado de ${exame.tipo_exame || 'Exame'}`,
      arquivo: `resultado-exame-${exame.id_exame}`,
      subtitulo: `Exame realizado em ${formatarDataExport(exame.data_exame)}`,
      secoes: [
        { titulo: 'Médico responsável', campos: [
          ['Médico', exame.medico || 'Não informado'],
          ['CRM', exame.crm || 'Não informado'],
          ['Especialidade', exame.especialidade || 'Não informado']
        ] },
        { titulo: 'Resultado', campos: [
          ['Status', exame.statusc || 'Pendente'],
          ['Suspeita', exame.suspeita_leucemia || 'Sem suspeita'],
          ['Tipo de leucemia', exame.tipo_leucemia || 'Não identificado'],
          ['Data do exame', formatarDataExport(exame.data_exame)],
          ['Data do resultado', formatarDataExport(exame.data_resultado)]
        ] }
      ],
      textos: [{ titulo: 'Resultado do exame', conteudo: exame.resultado_texto || 'Resultado ainda não disponível.' }]
    }, this);
  });

  HematoExport.criarBotoes(document.querySelector('.filtros-area'), {
    titulo: 'Resultados de Exames',
    arquivo: 'resultados-exames',
    obterLinhas: () => listaExibida,
    filtros: [
      { rotulo: 'Busca', id: 'searchInput' },
      { rotulo: 'Tipo', id: 'filtroTipo' },
      { rotulo: 'Status', id: 'filtroStatus' },
      { rotulo: 'Ordenação', id: 'filtroOrdenacao' }
    ],
    colunas: [
      { titulo: 'Exame', valor: e => e.tipo_exame || 'Exame', destaque: true },
      { titulo: 'Data do Exame', valor: e => formatarDataExport(e.data_exame) },
      { titulo: 'Status', valor: e => e.statusc || 'Pendente' },
      { titulo: 'Suspeita', valor: e => e.suspeita_leucemia || 'Sem suspeita' },
      { titulo: 'Tipo de Leucemia', valor: e => e.tipo_leucemia || 'Não identificado' },
      { titulo: 'Médico', valor: e => e.medico },
      { titulo: 'Data do Resultado', valor: e => formatarDataExport(e.data_resultado) }
    ]
  });

  // ============================================================
  //  FILTROS E ORDENAÇÃO (SEM A-Z)
  // ============================================================

  function filtrarResultados() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const tipo = document.getElementById('filtroTipo').value;
    const status = document.getElementById('filtroStatus').value;
    const ordenacao = document.getElementById('filtroOrdenacao').value;

    let filtrados = EXAMES.filter(e => e.resultado_texto);

    if (search) {
      filtrados = filtrados.filter(e => {
        const tipoMatch = (e.tipo_exame || '').toLowerCase().includes(search);
        const dataMatch = e.data_exame
          ? new Date(e.data_exame).toLocaleDateString('pt-BR').includes(search)
          : false;
        return tipoMatch || dataMatch;
      });
    }

    if (tipo) {
      filtrados = filtrados.filter(e => e.tipo_exame === tipo);
    }

    if (status) {
      filtrados = filtrados.filter(e => e.statusc === status);
    }

    switch (ordenacao) {
      case 'recentes':
        filtrados.sort((a, b) => new Date(b.data_exame) - new Date(a.data_exame));
        break;
      case 'antigos':
        filtrados.sort((a, b) => new Date(a.data_exame) - new Date(b.data_exame));
        break;
      default:
        break;
    }

    renderizarLista(filtrados);
  }

  const usuario = JSON.parse(localStorage.getItem("usuario"));

  if (!usuario || usuario.role !== "Paciente") {
    window.location.href = "../login.html";
  }

  if (typeof HematoAI !== 'undefined' && HematoAI.initSidebar) {
    HematoAI.initSidebar('resultados');
  } else {
    console.warn("HematoAI não definido. Verifique o arquivo JS/navbar.js");
  }

  window.onload = async () => {
    verificarPerfil("Paciente");

    await carregarExames();

    const todosResultados = EXAMES.filter(e => e.resultado_texto);
    renderizarLista(todosResultados);

    document.getElementById('searchInput').addEventListener('input', filtrarResultados);
    document.getElementById('filtroTipo').addEventListener('change', filtrarResultados);
    document.getElementById('filtroStatus').addEventListener('change', filtrarResultados);
    document.getElementById('filtroOrdenacao').addEventListener('change', filtrarResultados);
  };
</script>
</body>
</html>
