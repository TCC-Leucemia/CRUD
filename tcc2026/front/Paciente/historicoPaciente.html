<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="../JS/theme-init.js"></script>
  <script src="../JS/erro-popup.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HematoAI · Meu Histórico</title>
  <link rel="stylesheet" href="../CSS/navbar.css">
  <style>
    body { background: var(--bg); }

    .pac-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 0 48px;
    }

    /* ── Navegação ────────────────────────────────────── */
    .pac-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 6px;
      box-shadow: var(--shadow-sm);
      max-width: 540px;
    }

    .pac-nav-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-lg);
      font-size: .9rem;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: var(--transition);
      background: transparent;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .pac-nav-btn:hover { background: var(--bg); color: var(--text-1); }
    .pac-nav-btn.ativo {
      background: var(--red);
      color: #fff;
      box-shadow: 0 2px 8px rgba(185,28,28,.25);
    }

    /* ── Grid principal (lateral + detalhes) ───────────── */
    .pac-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Lista lateral */
    .lista-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 200px);
    }

    .lista-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: .875rem;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      flex-shrink: 0;
    }

    /* Campo de filtro por data */
    .filtro-data {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .filtro-data label {
      font-size: .8rem;
      color: var(--text-2);
      font-weight: 600;
      white-space: nowrap;
    }
    .filtro-data input[type="date"] {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: .8rem;
      background: var(--surface);
      color: var(--text-1);
      outline: none;
      font-family: var(--font);
      flex: 1;
      transition: var(--transition);
    }
    .filtro-data input[type="date"]:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.08);
    }

    .lista-exportar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .lista-exportar > span {
      font-size: .8rem;
      color: var(--text-2);
      font-weight: 600;
    }

    .lista-body {
      overflow-y: auto;
      flex: 1;
    }
    .lista-body::-webkit-scrollbar { width: 4px; }
    .lista-body::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 2px; }

    .lista-item {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
    }
    .lista-item:last-child { border-bottom: none; }
    .lista-item:hover { background: var(--bg); }
    .lista-item.selecionado {
      background: var(--red-light);
      border-left: 3px solid var(--red);
      padding-left: 17px;
    }

    .item-topo {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 4px;
    }
    .item-titulo { font-weight: 700; font-size: .875rem; color: var(--text-1); }
    .item-data   { font-size: .72rem; color: var(--text-3); }
    .item-sub    { font-size: .78rem; color: var(--text-2); margin-bottom: 6px; }

    /* Painel de detalhe */
    .detalhe-panel { display: flex; flex-direction: column; gap: 14px; }

    .detalhe-vazio {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 70px 20px;
      color: var(--text-3);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .detalhe-secao {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      animation: fadeUp .2s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    .detalhe-secao-header {
      padding: 13px 22px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-weight: 700; font-size: .875rem;
      display: flex; align-items: center; gap: 8px;
      color: var(--text-1);
    }

    .detalhe-secao-body { padding: 20px 22px; }

    .detalhe-linha {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 6px 14px;
      margin-bottom: 10px;
      font-size: .875rem;
    }
    .detalhe-linha:last-child { margin-bottom: 0; }
    .detalhe-label { color: var(--text-2); font-weight: 600; font-size: .82rem; }
    .detalhe-valor { color: var(--text-1); }

    /* Diagnóstico do médico */
    .diagnostico-box {
      background: var(--blue-light);
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }
    .diagnostico-label {
      font-size: .68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--blue); margin-bottom: 8px;
    }
    .diagnostico-texto {
      font-size: .875rem;
      line-height: 1.75;
      color: var(--text-1);
      white-space: pre-wrap;
    }
    .badge-diagnostico {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 700;
    }
    .diag-alta     { background: var(--red-mid);      color: var(--red);    }
    .diag-moderada { background: var(--yellow-light); color: var(--yellow); }
    .diag-baixa    { background: var(--green-light);  color: var(--green);  }
    .diag-sem      { background: #f1f5f9;             color: #475569;       }

    /* ── Modo escuro ── */
    .dark-mode .diagnostico-box {
      background: #1e3a8a;
      border-color: #3b82f6;
    }
    .dark-mode .diagnostico-label {
      color: #93c5fd;
    }
    .dark-mode .diagnostico-texto {
      color: #e2e8f0;
    }
    .dark-mode .diag-alta     { background: #7f1d1d; color: #fca5a5; }
    .dark-mode .diag-moderada { background: #78350f; color: #fcd34d; }
    .dark-mode .diag-baixa    { background: #1e3a8a; color: #93c5fd; }
    .dark-mode .diag-sem      { background: #334155; color: #cbd5e1; }

    .dark-mode .badge.badge-green {
      background: #064e3b;
      color: #6ee7b7;
    }
    .dark-mode .badge.badge-blue {
      background: #1e3a8a;
      color: #93c5fd;
    }
    .dark-mode .badge.badge-yellow {
      background: #78350f;
      color: #fcd34d;
    }
    .dark-mode .badge.badge-gray {
      background: #334155;
      color: #cbd5e1;
    }
    .dark-mode .badge.badge-purple {
      background: #4c1d95;
      color: #c4b5fd;
    }

    .dark-mode .lista-item { border-bottom-color: var(--border); }
    .dark-mode .lista-item.selecionado { background: #1e293b; border-left-color: var(--red); }
    .dark-mode .item-titulo { color: var(--text-1); }
    .dark-mode .item-data   { color: var(--text-3); }
    .dark-mode .item-sub    { color: var(--text-2); }
    .dark-mode .detalhe-secao { background: var(--surface); border-color: var(--border); }
    .dark-mode .detalhe-secao-header { background: var(--bg); border-bottom-color: var(--border); color: var(--text-1); }
    .dark-mode .detalhe-label { color: var(--text-2); }
    .dark-mode .detalhe-valor { color: var(--text-1); }
    .dark-mode .detalhe-vazio { background: var(--surface); border-color: var(--border); color: var(--text-3); }
    .dark-mode .pac-nav { background: var(--surface); border-color: var(--border); }
    .dark-mode .pac-nav-btn { color: var(--text-2); }
    .dark-mode .pac-nav-btn:hover { background: var(--bg); color: var(--text-1); }

    /* Botão Exportar PDF */
    .btn-exportar-pdf {
      background: var(--pdf);
      border: none;
      color: white;
      padding: 13px 28px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      width: auto;
      margin-top: 4px;
      font-family: var(--font);
      box-shadow: 0 2px 8px var(--pdf-shadow);
      display: none;
      align-self: flex-end;
    }
    .btn-exportar-pdf:hover {
      background: var(--pdf-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--pdf-shadow);
    }
    .btn-exportar-pdf:active { transform: translateY(0); }

    @media (max-width: 900px) {
      .pac-grid { grid-template-columns: 1fr; }
      .lista-panel { position: static; max-height: 340px; }
    }
    @media (max-width: 540px) {
      .pac-nav { max-width: 100%; }
      .filtro-data { flex-direction: column; align-items: stretch; }
      .detalhe-linha { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle">☰</button>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Meu Histórico Clínico</h1>
        <p>Consulte suas consultas e exames realizados no HematoAI</p>
      </div>
      <div class="page-header-right">
        <span class="badge badge-green">Paciente</span>
      </div>
    </div>

    <div class="page-body">
      <div class="pac-wrap">

        <!-- ── Navegação Consultas / Exames ──────────────── -->
        <div class="pac-nav">
          <button class="pac-nav-btn ativo" id="btnConsultas">Consultas</button>
          <button class="pac-nav-btn" id="btnExames">Exames</button>
        </div>

        <!-- ── Grid principal (lista + detalhes) ─────────── -->
        <div class="pac-grid">

          <!-- Lista lateral -->
          <div class="lista-panel">
            <div class="lista-header">
              <span id="listaTitulo">Minhas Consultas</span>
              <span class="badge badge-gray" id="listaContador">0</span>
            </div>
            <!-- Campo de filtro por data -->
            <div class="filtro-data">
              <label for="filtroData">📅 Filtrar por data:</label>
              <input type="date" id="filtroData">
            </div>
            <div class="lista-exportar" id="listaExportar">
              <span>Exportar lista</span>
            </div>
            <div class="lista-body" id="listaBody"></div>
          </div>

          <!-- Detalhe + Botão Exportar PDF -->
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div class="detalhe-panel" id="detalhePanel" style="width:100%;">
              <div class="detalhe-vazio">
                <p style="font-size:.95rem;font-weight:700;color:var(--text-2);margin-bottom:8px;">
                  Selecione um item
                </p>
                <p style="font-size:.82rem;">
                  Clique em um registro à esquerda para ver os detalhes completos.
                </p>
              </div>
            </div>
            <button class="btn-exportar-pdf" id="btnExportarPDF">📄 Exportar PDF</button>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../JS/auth.js"></script>
<script src="../JS/api.js"></script>
<script src="../JS/navbar.js"></script>
<script src="../JS/exportar.js"></script>
<script>

let CONSULTAS = [];
let EXAMES = [];

let viewAtiva  = 'consultas';
let idSelecionado = null;
let listaExibida = []; // exatamente o que a lista lateral mostra, para a exportação

// Inicializar sidebar
if (typeof HematoAI !== 'undefined' && HematoAI.initSidebar) {
  HematoAI.initSidebar('historico');
}

/* ═══════════════════════════════════════════════════════
   CARREGAMENTO DE DADOS
═══════════════════════════════════════════════════════ */
async function carregarConsultas() {

    try {

        const token = localStorage.getItem("token");

        const response = await fetch(
            "http://localhost:3000/consultas",
            {
                headers: {
                    Authorization: "Bearer " + token
                }
            }
        );

        const dados = await response.json();
        console.log("Resposta da API:", dados);

        if (!dados.status) {
            HematoAI.showToast("Erro ao carregar consultas", "error");
            return;
        }

        CONSULTAS = dados.dados.map(c => ({

            id: c.id_consulta,

            medico: c.medico,

            crm: c.crm,

            data: c.data_consulta,

            tipo: c.tipo_consulta,

            status: c.statusc,

            especialidade: c.especialidade || "Hematologia"

        }));

    } catch (e) {

        console.error(e);

        HematoAI.showToast(
            "Erro ao carregar consultas",
            "error"
        );
    }
  }

  async function carregarExames() {

    try {

        const token = localStorage.getItem("token");
        
        console.log("TOKEN:", token);

        const response = await fetch(
            "http://localhost:3000/exames",
            {
                headers: {
                    Authorization: "Bearer " + token
                }
            }
        );

        const dados = await response.json();

        if (!dados.status) {

            HematoAI.showToast(
                "Erro ao carregar exames",
                "error"
            );

            return;
        }

        EXAMES = dados.dados.map(e => ({

            id: e.id_exame,

            tipo: e.tipo_exame,

            data: e.data_exame,

            medico: e.medico,

            status: e.statusc,

            diagnostico: {

                resultado_texto: e.resultado_texto,

                suspeita_leucemia: e.suspeita_leucemia,

                tipo_leucemia: e.tipo_leucemia,

                data_resultado: e.data_resultado

            }

        }));

    } catch (e) {

        console.error(e);

        HematoAI.showToast(
            "Erro ao carregar exames",
            "error"
        );
    }
  }

/* ═══════════════════════════════════════════════════════
   NAVEGAÇÃO
═══════════════════════════════════════════════════════ */
document.getElementById('btnConsultas').addEventListener('click', () => setView('consultas'));
document.getElementById('btnExames').addEventListener('click',   () => setView('exames'));

function setView(view) {
  viewAtiva = view;
  idSelecionado = null;
  // Limpar filtro de data ao trocar de view
  document.getElementById('filtroData').value = '';

  document.getElementById('btnConsultas').classList.toggle('ativo', view === 'consultas');
  document.getElementById('btnExames').classList.toggle('ativo',    view === 'exames');

  if (view === 'consultas') {
    document.getElementById('listaTitulo').textContent = 'Minhas Consultas';
    renderLista(CONSULTAS, 'consulta');
  } else {
    document.getElementById('listaTitulo').textContent = 'Meus Exames';
    renderLista(EXAMES, 'exame');
  }

  document.getElementById('detalhePanel').innerHTML = `
    <div class="detalhe-vazio">
      <p style="font-size:.95rem;font-weight:700;color:var(--text-2);margin-bottom:8px;">Selecione um item</p>
      <p style="font-size:.82rem;">Clique em um registro à esquerda para ver os detalhes completos.</p>
    </div>`;
  document.getElementById('btnExportarPDF').style.display = 'none';
}

/* ═══════════════════════════════════════════════════════
   FILTRO POR DATA
═══════════════════════════════════════════════════════ */
document.getElementById('filtroData').addEventListener('change', function() {
  const dataFiltro = this.value;
  if (viewAtiva === 'consultas') {
    let dados = CONSULTAS;
    if (dataFiltro) {
      dados = CONSULTAS.filter(c => c.data.substring(0,10) === dataFiltro);
    }
    renderLista(dados, 'consulta');
    // Limpar seleção e detalhe
    idSelecionado = null;
    document.getElementById('detalhePanel').innerHTML = `
      <div class="detalhe-vazio">
        <p style="font-size:.95rem;font-weight:700;color:var(--text-2);margin-bottom:8px;">Selecione um item</p>
        <p style="font-size:.82rem;">Clique em um registro à esquerda para ver os detalhes completos.</p>
      </div>`;
    document.getElementById('btnExportarPDF').style.display = 'none';
  } else {
    let dados = EXAMES;
    if (dataFiltro) {
      dados = EXAMES.filter(e => e.data.substring(0,10) === dataFiltro);
    }
    renderLista(dados, 'exame');
    idSelecionado = null;
    document.getElementById('detalhePanel').innerHTML = `
      <div class="detalhe-vazio">
        <p style="font-size:.95rem;font-weight:700;color:var(--text-2);margin-bottom:8px;">Selecione um item</p>
        <p style="font-size:.82rem;">Clique em um registro à esquerda para ver os detalhes completos.</p>
      </div>`;
    document.getElementById('btnExportarPDF').style.display = 'none';
  }
});

/* ═══════════════════════════════════════════════════════
   RENDERIZAR LISTA
═══════════════════════════════════════════════════════ */
function renderLista(dados, tipo) {
  const body = document.getElementById('listaBody');
  listaExibida = dados;
  document.getElementById('listaContador').textContent = dados.length;
  body.innerHTML = '';

  if (!dados.length) {
    body.innerHTML = `<div class="empty-state" style="padding:40px 20px">
      <p>Nenhum registro encontrado.</p></div>`;
    return;
  }

  dados.forEach(item => {
    const div = document.createElement('div');
    div.className = 'lista-item' + (idSelecionado === item.id ? ' selecionado' : '');

    if (tipo === 'consulta') {
      div.innerHTML = `
        <div class="item-topo">
          <span class="item-titulo">${item.tipo}</span>
          <span class="item-data">${formatarData(item.data)}</span>
        </div>
        <div class="item-sub">${item.medico} · ${item.especialidade}</div>
        <span class="badge badge-${corStatus(item.status)}" style="font-size:.68rem">${item.status}</span>`;
      div.addEventListener('click', () => {
        selecionarConsulta(item);
      });
    } else {
      // Exames
      const diag = item.diagnostico || {};
      div.innerHTML = `
        <div class="item-topo">
          <span class="item-titulo">${item.tipo}</span>
          <span class="item-data">${formatarData(item.data)}</span>
        </div>
        <div class="item-sub">${item.medico}</div>
        <span class="badge badge-${corStatus(item.status)}" style="font-size:.68rem">${item.status}</span>`;
      div.addEventListener('click', () => {
        idSelecionado = item.id;
        renderLista(EXAMES, 'exame');
        renderDetalheExame(item);
        document.getElementById('btnExportarPDF').style.display = 'block';
      });
    }

    body.appendChild(div);
  });
}

/* ═══════════════════════════════════════════════════════
   FUNÇÃO PARA SELECIONAR CONSULTA (REUTILIZÁVEL)
═══════════════════════════════════════════════════════ */
function selecionarConsulta(consulta) {
  if (!consulta) return;

  idSelecionado = consulta.id;
  viewAtiva = 'consultas';

  // Atualizar botões de navegação
  document.getElementById('btnConsultas').classList.add('ativo');
  document.getElementById('btnExames').classList.remove('ativo');

  // Atualizar título da lista
  document.getElementById('listaTitulo').textContent = 'Minhas Consultas';

  // Renderizar lista com destaque
  renderLista(CONSULTAS, 'consulta');

  // Renderizar detalhes
  renderDetalheConsulta(consulta);

  // Mostrar botão PDF
  document.getElementById('btnExportarPDF').style.display = 'block';
}

/* ═══════════════════════════════════════════════════════
   ENCONTRAR PRÓXIMA CONSULTA
═══════════════════════════════════════════════════════ */
function encontrarProximaConsulta() {
  const agora = new Date();
  const proximas = CONSULTAS
    .filter(c => new Date(c.data) > agora)
    .sort((a, b) => new Date(a.data) - new Date(b.data));

  return proximas.length > 0 ? proximas[0] : null;
}

/* ═══════════════════════════════════════════════════════
   DETALHE CONSULTA
═══════════════════════════════════════════════════════ */
function renderDetalheConsulta(c) {
  document.getElementById('detalhePanel').innerHTML = `
    <div class="detalhe-secao">
      <div class="detalhe-secao-header">Dados da Consulta</div>
      <div class="detalhe-secao-body">
        <div class="detalhe-linha">
          <span class="detalhe-label">Médico</span>
          <span class="detalhe-valor"><strong>${c.medico}</strong></span>
        </div>
        <div class="detalhe-linha">
          <span class="detalhe-label">CRM</span>
          <span class="detalhe-valor" style="font-family:var(--font-mono);font-size:.82rem">${c.crm}</span>
        </div>
        <div class="detalhe-linha">
          <span class="detalhe-label">Especialidade</span>
          <span class="detalhe-valor">${c.especialidade}</span>
        </div>
        <div class="detalhe-linha">
          <span class="detalhe-label">Data</span>
          <span class="detalhe-valor">${formatarDataLonga(c.data)}</span>
        </div>
        <div class="detalhe-linha">
          <span class="detalhe-label">Tipo</span>
          <span class="detalhe-valor">${c.tipo}</span>
        </div>
        <div class="detalhe-linha">
          <span class="detalhe-label">Status</span>
          <span class="detalhe-valor">
            <span class="badge badge-${corStatus(c.status)}">${c.status}</span>
          </span>
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════
   DETALHE EXAME
═══════════════════════════════════════════════════════ */
function renderDetalheExame(e) {
  const d = e.diagnostico || {};
  const suspeitaMap = { 'Alta':'diag-alta', 'Moderada':'diag-moderada', 'Baixa':'diag-baixa', 'Sem suspeita':'diag-sem' };
  const classeSuspeita = suspeitaMap[d.suspeita_leucemia] || 'diag-sem';

  document.getElementById('detalhePanel').innerHTML = `
    <div class="detalhe-secao">
      <div class="detalhe-secao-header">Informações do Exame</div>
      <div class="detalhe-secao-body">
        <div class="detalhe-linha">
          <span class="detalhe-label">Tipo</span>
          <span class="detalhe-valor"><strong>${e.tipo}</strong></span>
        </div>
        <div class="detalhe-linha">
          <span class="detalhe-label">Data</span>
          <span class="detalhe-valor">${formatarDataLonga(e.data)}</span>
        </div>
        <div class="detalhe-linha">
          <span class="detalhe-label">Médico</span>
          <span class="detalhe-valor">${e.medico}</span>
        </div>
        <div class="detalhe-linha">
          <span class="detalhe-label">Status</span>
          <span class="detalhe-valor">
            <span class="badge badge-${corStatus(e.status)}">${e.status}</span>
          </span>
        </div>
      </div>
    </div>

    <div class="detalhe-secao">
      <div class="detalhe-secao-header">Diagnóstico do Médico</div>
      <div class="detalhe-secao-body">
        <div class="diagnostico-box">
          <div class="diagnostico-label">Resultado do Exame</div>
          <div class="diagnostico-texto">${d.resultado_texto || 'Não informado'}</div>
          <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
            <span class="badge-diagnostico ${classeSuspeita}">${d.suspeita_leucemia || '—'}</span>
            ${d.tipo_leucemia && d.tipo_leucemia !== 'Não identificado'
              ? `<span class="badge badge-purple">Tipo: ${d.tipo_leucemia}</span>`
              : ''}
          </div>
          <div style="margin-top:10px;font-size:.78rem;color:var(--text-3);">
            Data do resultado: ${formatarData(d.data_resultado) || '—'}
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
function corStatus(s) {
  return { Finalizado:'green', 'Em andamento':'blue', Pendente:'yellow' }[s] || 'gray';
}
function formatarData(d) {
    if (!d) return "—";

    const data = new Date(d);

    if (isNaN(data)) return "—";

    return data.toLocaleDateString("pt-BR");
}

function formatarDataLonga(d) {
    if (!d) return "—";

    const data = new Date(d);

    if (isNaN(data)) return "—";

    return data.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });
}

/* ═══════════════════════════════════════════════════════
   EXPORTAÇÃO
═══════════════════════════════════════════════════════ */
const COLUNAS_CONSULTAS = [
  { titulo: 'Data', valor: c => formatarData(c.data) },
  { titulo: 'Tipo', valor: c => c.tipo, destaque: true },
  { titulo: 'Médico', valor: c => c.medico },
  { titulo: 'CRM', valor: c => c.crm },
  { titulo: 'Especialidade', valor: c => c.especialidade },
  { titulo: 'Status', valor: c => c.status }
];

const COLUNAS_EXAMES = [
  { titulo: 'Data', valor: e => formatarData(e.data) },
  { titulo: 'Tipo', valor: e => e.tipo, destaque: true },
  { titulo: 'Médico', valor: e => e.medico },
  { titulo: 'Status', valor: e => e.status },
  { titulo: 'Suspeita', valor: e => (e.diagnostico || {}).suspeita_leucemia },
  { titulo: 'Data do Resultado', valor: e => formatarData((e.diagnostico || {}).data_resultado) }
];

HematoExport.criarBotoes('listaExportar', {
  titulo: () => viewAtiva === 'consultas' ? 'Minhas Consultas' : 'Meus Exames',
  arquivo: () => viewAtiva === 'consultas' ? 'minhas-consultas' : 'meus-exames',
  colunas: () => viewAtiva === 'consultas' ? COLUNAS_CONSULTAS : COLUNAS_EXAMES,
  obterLinhas: () => listaExibida,
  filtros: [{ rotulo: 'Data', id: 'filtroData' }]
});

// Ficha em PDF do item aberto no painel de detalhes.
document.getElementById('btnExportarPDF').addEventListener('click', function() {
  if (viewAtiva === 'consultas') {
    const c = CONSULTAS.find(x => x.id === idSelecionado);
    if (!c) return;
    HematoExport.exportarFichaPDF({
      titulo: 'Ficha da Consulta',
      arquivo: `consulta-${c.id}`,
      subtitulo: `${c.tipo || 'Consulta'} · ${formatarDataLonga(c.data)}`,
      secoes: [{ titulo: 'Dados da Consulta', campos: [
        ['Médico', c.medico],
        ['CRM', c.crm],
        ['Especialidade', c.especialidade],
        ['Data', formatarDataLonga(c.data)],
        ['Tipo', c.tipo],
        ['Status', c.status]
      ] }]
    }, this);
    return;
  }

  const e = EXAMES.find(x => x.id === idSelecionado);
  if (!e) return;
  const d = e.diagnostico || {};
  HematoExport.exportarFichaPDF({
    titulo: 'Ficha do Exame',
    arquivo: `exame-${e.id}`,
    subtitulo: `${e.tipo || 'Exame'} · ${formatarDataLonga(e.data)}`,
    secoes: [
      { titulo: 'Informações do Exame', campos: [
        ['Tipo', e.tipo],
        ['Data', formatarDataLonga(e.data)],
        ['Médico', e.medico],
        ['Status', e.status]
      ] },
      { titulo: 'Diagnóstico do Médico', campos: [
        ['Suspeita', d.suspeita_leucemia],
        ['Tipo de leucemia', d.tipo_leucemia || 'Não identificado'],
        ['Data do resultado', formatarData(d.data_resultado)]
      ] }
    ],
    textos: [{ titulo: 'Resultado do Exame', conteudo: d.resultado_texto || 'Não informado' }]
  }, this);
});

/* ═══════════════════════════════════════════════════════
   INICIALIZAÇÃO
═══════════════════════════════════════════════════════ */
(async () => {
    verificarPerfil("Paciente");
    await carregarConsultas();
    await carregarExames();

    // Configurar a view padrão como 'consultas'
    viewAtiva = 'consultas';
    document.getElementById('btnConsultas').classList.add('ativo');
    document.getElementById('btnExames').classList.remove('ativo');
    document.getElementById('listaTitulo').textContent = 'Minhas Consultas';
    renderLista(CONSULTAS, 'consulta');
    // Detalhe vazio inicial
    document.getElementById('detalhePanel').innerHTML = `
      <div class="detalhe-vazio">
        <p style="font-size:.95rem;font-weight:700;color:var(--text-2);margin-bottom:8px;">Selecione um item</p>
        <p style="font-size:.82rem;">Clique em um registro à esquerda para ver os detalhes completos.</p>
      </div>`;
    document.getElementById('btnExportarPDF').style.display = 'none';

    // Encontrar próxima consulta e selecioná-la automaticamente
    const proxima = encontrarProximaConsulta();
    if (proxima) {
      selecionarConsulta(proxima);
    }
})();
</script>
