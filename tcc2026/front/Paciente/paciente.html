<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="../JS/theme-init.js"></script>
  <script src="../JS/erro-popup.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HematoAI · Meu Painel</title>
  <link rel="stylesheet" href="../CSS/navbar.css">
  <style>
    /* ── Layout principal ───────────────────────────────── */
    .pac-dashboard {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 4px;
    }

    /* ── Indicadores ────────────────────────────────────── */
    .stats-indicators {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-indicator-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px 12px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .stat-indicator-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--red);
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .stat-indicator-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--red);
    }

    .stat-indicator-card:hover::before {
      opacity: 1;
    }

    .stat-indicator-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--red);
      line-height: 1.2;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
      display: block;
    }

    .stat-indicator-label {
      font-size: 0.78rem;
      color: var(--text-2);
      font-weight: 600;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    /* ── Grid principal (2x2) ──────────────────────────── */
    .pac-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* ── Cards do dashboard ────────────────────────────── */
    .pac-dashboard .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pac-dashboard .card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-dark);
    }

    .pac-dashboard .card-header {
      padding: 16px 20px 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pac-dashboard .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pac-dashboard .card-title i {
      font-size: 1.1rem;
      color: var(--red);
    }

    .pac-dashboard .card-body {
      padding: 16px 20px 20px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── Linhas de informação ──────────────────────────── */
    .info-linha {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .info-linha:last-of-type {
      border-bottom: none;
    }
    .info-linha .label {
      color: var(--text-2);
      font-weight: 500;
      white-space: nowrap;
    }
    .info-linha .valor {
      color: var(--text-1);
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    /* Destaque para data/horário em Próxima Consulta */
    .info-linha .valor-destaque {
      font-weight: 700;
      color: var(--red);
      font-size: 1.05rem;
    }

    .consulta-status {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .placeholder-text {
      color: var(--text-3);
      font-size: 0.9rem;
      padding: 24px 0;
      text-align: center;
      font-weight: 500;
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg);
    }

    /* ── Badges de status ── */
    .status-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .status-finalizado {
      background: #dcfce7;
      color: #15803d;
    }
    .status-andamento {
      background: #dbeafe;
      color: #2563eb;
    }
    .status-pendente {
      background: #fef3c7;
      color: #d97706;
    }

    .dark-mode .status-finalizado {
      background: #064e3b;
      color: #6ee7b7;
    }
    .dark-mode .status-andamento {
      background: #1e3a8a;
      color: #93c5fd;
    }
    .dark-mode .status-pendente {
      background: #78350f;
      color: #fcd34d;
    }

    /* ── Alertas ── */
    .alerta-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--bg);
      margin-bottom: 8px;
      border-left: 4px solid var(--red);
      transition: background 0.2s ease;
      font-size: 0.9rem;
    }
    .alerta-item:last-child {
      margin-bottom: 0;
    }
    .alerta-item:hover {
      background: var(--surface-hover, #f8fafc);
    }
    .alerta-item .icone {
      font-size: 1.2rem;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
      color: var(--red);
    }
    .alerta-item .texto {
      color: var(--text-1);
      flex: 1;
      font-weight: 500;
      line-height: 1.4;
    }

    /* Alerta sem pendências */
    .alerta-item.alerta-ok {
      border-left-color: var(--blue, #2563eb);
    }
    .alerta-item.alerta-ok .icone {
      color: var(--blue, #2563eb);
    }

    /* ── Resumo Clínico ── */
    .resumo-linha {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      gap: 12px;
    }
    .resumo-linha:last-child {
      border-bottom: none;
    }
    .resumo-linha .label {
      color: var(--text-2);
      font-weight: 500;
      white-space: nowrap;
    }
    .resumo-linha .valor {
      color: var(--text-1);
      font-weight: 700;
      text-align: right;
    }

    /* ── Botão "Ver histórico" ── */
    .btn-ver-historico {
      width: 100%;
      justify-content: center;
      margin-top: 8px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-ver-historico:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* ── Modo escuro ── */
    .dark-mode .pac-dashboard .card {
      background: var(--surface);
      border-color: var(--border);
    }
    .dark-mode .info-linha,
    .dark-mode .consulta-status,
    .dark-mode .resumo-linha {
      border-bottom-color: var(--border);
    }
    .dark-mode .alerta-item {
      background: var(--surface);
      border-left-color: var(--red);
    }
    .dark-mode .alerta-item.alerta-ok {
      border-left-color: var(--blue);
    }
    .dark-mode .placeholder-text {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text-3);
    }

    /* ── Responsividade ────────────────────────────────── */
    @media (max-width: 1024px) {
      .pac-grid {
        grid-template-columns: 1fr;
      }
      .stats-indicators {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 600px) {
      .stats-indicators {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .stat-indicator-number {
        font-size: 1.8rem;
      }
      .pac-dashboard .card-header {
        padding: 14px 16px 10px;
      }
      .pac-dashboard .card-body {
        padding: 14px 16px 16px;
      }
      .info-linha,
      .resumo-linha {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .info-linha .valor,
      .resumo-linha .valor {
        text-align: left;
      }
      .alerta-item {
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle">☰</button>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Meu Painel</h1>
        <p id="headerDate">Bem-vindo ao HematoAI</p>
      </div>
      <div class="page-header-right">
        <span class="badge badge-green">Paciente</span>
      </div>
    </div>

    <div class="page-body">
      <div class="pac-dashboard">

        <!-- ─── INDICADORES ────────────────────────────────── -->
        <div class="stats-indicators">
          <div class="stat-indicator-card">
            <div class="stat-indicator-number" id="totalConsultas">0</div>
            <div class="stat-indicator-label">Consultas</div>
          </div>
          <div class="stat-indicator-card">
            <div class="stat-indicator-number" id="totalExames">0</div>
            <div class="stat-indicator-label">Exames</div>
          </div>
          <div class="stat-indicator-card">
            <div class="stat-indicator-number" id="totalResultados">0</div>
            <div class="stat-indicator-label">Resultados</div>
          </div>
          <div class="stat-indicator-card">
            <div class="stat-indicator-number" id="proximasConsultas">0</div>
            <div class="stat-indicator-label">Próximas</div>
          </div>
        </div>

        <!-- ─── GRID PRINCIPAL (2x2) ────────────────────────── -->
        <div class="pac-grid">

          <!-- Card 1: Próxima Consulta -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">
                <i data-lucide="calendar-clock"></i> Próxima Consulta
              </span>
            </div>
            <div class="card-body">
              <div id="proximaConsulta">
                <!-- Preenchido via JavaScript -->
                <div class="placeholder-text">Nenhuma consulta agendada.</div>
              </div>
              <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);">
                <a href="historicoPaciente.html" class="btn btn-outline btn-sm btn-ver-historico">
                  <i data-lucide="history"></i> Ver histórico
                </a>
              </div>
            </div>
          </div>

          <!-- Card 2: Último Exame -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">
                <i data-lucide="flask-conical"></i> Último Exame
              </span>
            </div>
            <div class="card-body">
              <div id="ultimoExame">
                <!-- Preenchido via JavaScript -->
                <div class="placeholder-text">Nenhum exame encontrado.</div>
              </div>
            </div>
          </div>

          <!-- Card 3: Alertas -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">
                <i data-lucide="bell"></i> Alertas
              </span>
            </div>
            <div class="card-body">
              <div id="listaAlertas">
                <!-- Preenchido via JavaScript -->
              </div>
            </div>
          </div>

          <!-- Card 4: Resumo Clínico -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">
                <i data-lucide="clipboard-list"></i> Resumo Clínico
              </span>
            </div>
            <div class="card-body">
              <div id="resumoClinico">
                <!-- Preenchido via JavaScript -->
              </div>
            </div>
          </div>

        </div><!-- /pac-grid -->

      </div><!-- /pac-dashboard -->
    </div><!-- /page-body -->
  </div><!-- /main-content -->
</div><!-- /app-layout -->

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../JS/navbar.js"></script>
<script src="../JS/auth.js"></script>
<script>
  // ============================================================
  //  AUTENTICAÇÃO E SIDEBAR
  // ============================================================
  const usuario = JSON.parse(localStorage.getItem("usuario"));

  if (!usuario || usuario.role !== "Paciente") {
    window.location.href = "../login.html";
  }

  if (typeof HematoAI !== 'undefined' && HematoAI.initSidebar) {
    HematoAI.initSidebar('paciente');
  } else {
    console.warn("HematoAI não definido. Verifique o arquivo JS/navbar.js");
  }

  // Data no cabeçalho
  const dataAtual = new Date().toLocaleDateString('pt-BR', {
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  });
  const headerElement = document.getElementById('headerDate');
  if (headerElement) {
    headerElement.textContent = dataAtual;
  }

  let CONSULTAS = [];
  let EXAMES = [];

  async function carregarDashboard() {
    await carregarConsultas();
    await carregarExames();
    atualizarIndicadores();
    preencherProximaConsulta();
    preencherUltimoExame();
    preencherAlertas();
    preencherResumo();
    // Inicializar ícones Lucide após renderização dinâmica
    if (window.lucide) {
      lucide.createIcons();
    }
  }

  async function carregarConsultas() {
    try {
      const token = localStorage.getItem("token");
      const response = await fetch("http://localhost:3000/consultas", {
        headers: { Authorization: "Bearer " + token }
      });
      const dados = await response.json();
      if (!dados.status) {
        HematoAI.showToast("Erro ao carregar consultas", "error");
        return;
      }
      CONSULTAS = dados.dados.map(c => ({
        id: c.id_consulta,
        medico: c.medico,
        crm: c.crm,
        data: c.data_consulta,
        tipo: c.tipo_consulta,
        status: c.statusc,
        especialidade: c.especialidade || "Hematologia"
      }));
    } catch (e) {
      console.error(e);
      HematoAI.showToast("Erro ao carregar consultas", "error");
    }
  }

  async function carregarExames() {
    try {
      const token = localStorage.getItem("token");
      const response = await fetch("http://localhost:3000/exames", {
        headers: { Authorization: "Bearer " + token }
      });
      const dados = await response.json();
      if (!dados.status) {
        HematoAI.showToast("Erro ao carregar exames", "error");
        return;
      }
      EXAMES = dados.dados.map(e => ({
        id: e.id_exame,
        tipo: e.tipo_exame,
        data: e.data_exame,
        medico: e.medico,
        status: e.statusc,
        diagnostico: e.resultado_texto ? {
          resultado_texto: e.resultado_texto,
          suspeita_leucemia: e.suspeita_leucemia,
          tipo_leucemia: e.tipo_leucemia,
          data_resultado: e.data_resultado
        } : null
      }));
    } catch (e) {
      console.error(e);
      HematoAI.showToast("Erro ao carregar exames", "error");
    }
  }

  function atualizarIndicadores() {
    document.getElementById("totalConsultas").textContent = CONSULTAS.length;
    document.getElementById("totalExames").textContent = EXAMES.length;
    document.getElementById("totalResultados").textContent = EXAMES.filter(e => e.diagnostico).length;
    document.getElementById("proximasConsultas").textContent = CONSULTAS.filter(c => new Date(c.data) > new Date()).length;
  }

  function preencherProximaConsulta() {
    const div = document.getElementById("proximaConsulta");
    const futuras = CONSULTAS
      .filter(c => new Date(c.data) > new Date())
      .sort((a, b) => new Date(a.data) - new Date(b.data));

    const consulta = futuras[0];

    if (!consulta) {
      div.innerHTML = `<div class="placeholder-text">Nenhuma consulta agendada.</div>`;
      return;
    }

    // Extrair data e hora separadamente para melhor hierarquia
    const dataConsulta = new Date(consulta.data);
    const dataFormatada = dataConsulta.toLocaleDateString('pt-BR');
    const horaFormatada = dataConsulta.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    div.innerHTML = `
      <div class="info-linha">
        <span class="label">Data</span>
        <span class="valor valor-destaque">${dataFormatada}</span>
      </div>
      <div class="info-linha">
        <span class="label">Horário</span>
        <span class="valor">${horaFormatada}</span>
      </div>
      <div class="info-linha">
        <span class="label">Médico</span>
        <span class="valor">${consulta.medico || '—'}</span>
      </div>
      <div class="info-linha">
        <span class="label">Especialidade</span>
        <span class="valor">${consulta.especialidade}</span>
      </div>
      <div class="consulta-status">
        ${statusBadge(consulta.status)}
      </div>
    `;
  }

  function preencherUltimoExame() {
    const div = document.getElementById("ultimoExame");

    if (EXAMES.length === 0) {
      div.innerHTML = `<div class="placeholder-text">Nenhum exame encontrado.</div>`;
      return;
    }

    // Ordenar sem alterar o array original
    const exame = [...EXAMES].sort((a, b) => new Date(b.data) - new Date(a.data))[0];

    div.innerHTML = `
      <div class="info-linha">
        <span class="label">Tipo</span>
        <span class="valor">${exame.tipo}</span>
      </div>
      <div class="info-linha">
        <span class="label">Data</span>
        <span class="valor">${formatarData(exame.data)}</span>
      </div>
      <div class="info-linha">
        <span class="label">Status</span>
        <span class="valor">${statusBadge(exame.status)}</span>
      </div>
      <div class="info-linha">
        <span class="label">Resultado</span>
        <span class="valor">${exame.diagnostico ? 'Disponível' : 'Pendente'}</span>
      </div>
    `;
  }

  function preencherAlertas() {
    const div = document.getElementById("listaAlertas");
    let html = "";

    const futuras = CONSULTAS.filter(c => new Date(c.data) > new Date());
    const pendentes = EXAMES.filter(e => e.status === "Pendente");
    const resultados = EXAMES.filter(e => e.diagnostico);

    if (futuras.length > 0) {
      html += `
        <div class="alerta-item">
          <span class="icone"><i data-lucide="calendar-clock"></i></span>
          <span class="texto">Você possui consulta agendada.</span>
        </div>
      `;
    }

    if (pendentes.length > 0) {
      html += `
        <div class="alerta-item">
          <span class="icone"><i data-lucide="flask-conical"></i></span>
          <span class="texto">Existem exames pendentes.</span>
        </div>
      `;
    }

    if (resultados.length > 0) {
      html += `
        <div class="alerta-item">
          <span class="icone"><i data-lucide="file-text"></i></span>
          <span class="texto">Existem resultados disponíveis.</span>
        </div>
      `;
    }

    if (html === "") {
      html = `
        <div class="alerta-item alerta-ok">
          <span class="icone"><i data-lucide="check-circle"></i></span>
          <span class="texto">Nenhuma pendência.</span>
        </div>
      `;
    }

    div.innerHTML = html;
  }

  function preencherResumo() {
    const div = document.getElementById("resumoClinico");

    // Ordenar sem alterar arrays originais
    const ultimaConsulta = [...CONSULTAS].sort((a, b) => new Date(b.data) - new Date(a.data))[0];
    const proximaConsulta = CONSULTAS
      .filter(c => new Date(c.data) > new Date())
      .sort((a, b) => new Date(a.data) - new Date(b.data))[0];
    const ultimoExame = [...EXAMES].sort((a, b) => new Date(b.data) - new Date(a.data))[0];

    // Dados clínicos adicionais
    const examesComDiagnostico = EXAMES.filter(e => e.diagnostico);
    const ultimoDiagnostico = examesComDiagnostico.length > 0
      ? [...examesComDiagnostico].sort((a, b) => new Date(b.data) - new Date(a.data))[0].diagnostico
      : null;

    div.innerHTML = `
      <div class="resumo-linha">
        <span class="label">Última consulta</span>
        <span class="valor">${ultimaConsulta ? formatarData(ultimaConsulta.data) : '—'}</span>
      </div>
      <div class="resumo-linha">
        <span class="label">Próxima consulta</span>
        <span class="valor">${proximaConsulta ? formatarData(proximaConsulta.data) : '—'}</span>
      </div>
      <div class="resumo-linha">
        <span class="label">Último exame</span>
        <span class="valor">${ultimoExame ? formatarData(ultimoExame.data) : '—'}</span>
      </div>
      <div class="resumo-linha">
        <span class="label">Resultados disponíveis</span>
        <span class="valor">${EXAMES.filter(e => e.diagnostico).length}</span>
      </div>
      ${ultimoDiagnostico ? `
      <div class="resumo-linha">
        <span class="label">Suspeita de leucemia</span>
        <span class="valor">${ultimoDiagnostico.suspeita_leucemia || 'Não avaliada'}</span>
      </div>
      <div class="resumo-linha">
        <span class="label">Tipo de leucemia</span>
        <span class="valor">${ultimoDiagnostico.tipo_leucemia || 'Não identificado'}</span>
      </div>
      ` : ''}
    `;
  }

  function statusBadge(status) {
    const map = {
      'Finalizado': 'status-finalizado',
      'Em andamento': 'status-andamento',
      'Pendente': 'status-pendente'
    };
    return `<span class="status-badge ${map[status] || 'status-pendente'}">${status}</span>`;
  }

  function formatarData(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR');
  }

  // ============================================================
  //  INICIALIZAÇÃO
  // ============================================================
  window.onload = async () => {
